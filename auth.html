<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZOTO CLOUD - Connexion</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .logo span {
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .location {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .location.loading {
            color: #6b7280;
            background: #f3f4f6;
        }

        .location.success {
            color: #166534;
            background: #dcfce7;
        }

        .location.warning {
            color: #92400e;
            background: #fef3c7;
        }

        .button {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            margin-top: 5px;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .button:hover {
            opacity: .9;
        }

        .button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }

        .switch button {
            border: none;
            background: none;
            color: #2563eb;
            cursor: pointer;
            font-weight: bold;
        }

        .message {
            display: none;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .success-message {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error-message {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        .hidden {
            display: none;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="logo">
        ZOTO <span>CLOUD</span>
    </div>

    <div class="subtitle">
        Votre espace personnel de stockage
    </div>


    <div
        id="message"
        class="message"
    ></div>


    <!-- =========================
         CONNEXION
    ========================== -->

    <div id="loginSection">

        <h2>
            Connexion
        </h2>


        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    E-mail
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    required
                >

            </div>


            <button
                type="submit"
                class="button primary"
                id="loginButton"
            >
                Se connecter
            </button>

        </form>


        <div class="switch">

            Pas encore de compte ?

            <button
                type="button"
                onclick="showRegister()"
            >
                Créer un compte
            </button>

        </div>

    </div>


    <!-- =========================
         INSCRIPTION
    ========================== -->

    <div
        id="registerSection"
        class="hidden"
    >

        <h2>
            Créer un compte
        </h2>


        <form id="registerForm">

            <div class="form-group">

                <label for="fullName">
                    Nom complet
                </label>

                <input
                    type="text"
                    id="fullName"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    E-mail
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirmer le mot de passe
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="6"
                    required
                >

            </div>


            <!-- LOCATION AUTOMATIQUE -->

            <div
                id="locationStatus"
                class="location loading"
            >
                🌍 Détection automatique du pays et de la ville...
            </div>


            <button
                type="submit"
                class="button primary"
                id="registerButton"
            >
                Créer mon compte
            </button>

        </form>


        <div class="switch">

            Déjà un compte ?

            <button
                type="button"
                onclick="showLogin()"
            >
                Se connecter
            </button>

        </div>

    </div>

</div>


<script>

/* ==========================================
   VARIABLES
========================================== */

let supabaseClient = null;

let detectedCountry = "";

let detectedCity = "";

let locationDetected = false;


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

}


/* ==========================================
   LOGIN / REGISTER
========================================== */

function showLogin() {

    document
        .getElementById("loginSection")
        .classList
        .remove("hidden");

    document
        .getElementById("registerSection")
        .classList
        .add("hidden");

    document
        .getElementById("message")
        .className =
        "message";

}


function showRegister() {

    document
        .getElementById("loginSection")
        .classList
        .add("hidden");

    document
        .getElementById("registerSection")
        .classList
        .remove("hidden");

    detectLocation();

}


/* ==========================================
   SUPABASE
========================================== */

async function initSupabase() {

    try {

        const response =
            await fetch("/api/config");


        if (!response.ok) {

            throw new Error(
                "Impossible de récupérer la configuration Supabase."
            );

        }


        const config =
            await response.json();


        if (
            !config.url ||
            !config.key
        ) {

            throw new Error(
                "Configuration Supabase manquante."
            );

        }


        supabaseClient =
            window.supabase.createClient(
                config.url,
                config.key
            );


        console.log(
            "Supabase connecté."
        );


    } catch (error) {

        console.error(
            "SUPABASE ERROR:",
            error
        );


        showMessage(
            error.message,
            "error-message"
        );

    }

}


/* ==========================================
   DETECTION LOCATION
========================================== */

async function detectLocation() {

    const status =
        document.getElementById(
            "locationStatus"
        );


    detectedCountry = "";

    detectedCity = "";

    locationDetected = false;


    status.className =
        "location loading";


    status.textContent =
        "🌍 Détection automatique du pays et de la ville...";


    try {

        const controller =
            new AbortController();


        const timeout =
            setTimeout(
                () => controller.abort(),
                7000
            );


        const response =
            await fetch(
                "https://ipapi.co/json/",
                {
                    signal:
                        controller.signal
                }
            );


        clearTimeout(timeout);


        if (!response.ok) {

            throw new Error(
                "Service de localisation indisponible."
            );

        }


        const data =
            await response.json();


        detectedCountry =
            typeof data.country_name === "string"
                ? data.country_name.trim()
                : "";


        detectedCity =
            typeof data.city === "string"
                ? data.city.trim()
                : "";


        /*
         * Raha nahazo pays sy ville
         */

        if (
            detectedCountry &&
            detectedCity
        ) {

            locationDetected = true;


            status.className =
                "location success";


            status.textContent =
                `🌍 Pays : ${detectedCountry} | 🏙️ Ville : ${detectedCity}`;


            console.log(
                "LOCATION:",
                detectedCountry,
                detectedCity
            );


            return;

        }


        /*
         * Raha pays ihany no azo
         */

        if (detectedCountry) {

            locationDetected = true;


            status.className =
                "location success";


            status.textContent =
                `🌍 Pays détecté : ${detectedCountry} | 🏙️ Ville non disponible`;


            return;

        }


        throw new Error(
            "Localisation vide."
        );


    } catch (error) {

        console.warn(
            "LOCATION ERROR:",
            error
        );


        detectedCountry = "";

        detectedCity = "";

        locationDetected = false;


        status.className =
            "location warning";


        status.textContent =
            "⚠️ Localisation automatique indisponible. Vous pouvez continuer l'inscription.";

    }

}


/* ==========================================
   INSCRIPTION
========================================== */

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (!supabaseClient) {

                showMessage(
                    "Supabase n'est pas prêt.",
                    "error-message"
                );

                return;

            }


            const fullName =
                document
                    .getElementById("fullName")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("registerEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("registerPassword")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            if (
                password !==
                confirmPassword
            ) {

                showMessage(
                    "Les mots de passe ne correspondent pas.",
                    "error-message"
                );

                return;

            }


            if (
                password.length < 6
            ) {

                showMessage(
                    "Le mot de passe doit contenir au moins 6 caractères.",
                    "error-message"
                );

                return;

            }


            const button =
                document.getElementById(
                    "registerButton"
                );


            button.disabled = true;

            button.textContent =
                "Création du compte...";


            try {

                /*
                 * Raha mbola tsy vita ny
                 * détection dia manandrana
                 * indray mandeha.
                 */

                if (
                    !locationDetected
                ) {

                    await detectLocation();

                }


                console.log(
                    "Inscription avec localisation:",
                    {
                        country:
                            detectedCountry,

                        city:
                            detectedCity
                    }
                );


                /*
                 * Création Supabase Auth
                 *
                 * country/city dia alefa
                 * ao amin'ny metadata.
                 */

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signUp({

                            email:
                                email,

                            password:
                                password,

                            options: {

                                data: {

                                    full_name:
                                        fullName,

                                    country:
                                        detectedCountry,

                                    city:
                                        detectedCity

                                }

                            }

                        });


                if (error) {

                    throw error;

                }


                /*
                 * Tsy manao INSERT ao profiles
                 * eto.
                 *
                 * Ny trigger Supabase no
                 * mamorona profiles.
                 */


                console.log(
                    "USER CREATED:",
                    data.user
                );


                showMessage(
                    "✅ Compte créé avec succès ! Vérifiez votre e-mail pour confirmer votre compte.",
                    "success-message"
                );


                document
                    .getElementById(
                        "registerForm"
                    )
                    .reset();


                /*
                 * Re-détection ho an'ny
                 * prochaine inscription.
                 */

                await detectLocation();


            } catch (error) {

                console.error(
                    "REGISTER ERROR:",
                    error
                );


                showMessage(
                    error.message ||
                    "Erreur pendant l'inscription.",
                    "error-message"
                );


            } finally {

                button.disabled = false;

                button.textContent =
                    "Créer mon compte";

            }

        }
    );


/* ==========================================
   CONNEXION
========================================== */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (!supabaseClient) {

                showMessage(
                    "Supabase n'est pas prêt.",
                    "error-message"
                );

                return;

            }


            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            const button =
                document.getElementById(
                    "loginButton"
                );


            button.disabled = true;

            button.textContent =
                "Connexion...";


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email:
                                email,

                            password:
                                password

                        });


                if (error) {

                    throw error;

                }


                if (
                    !data ||
                    !data.user
                ) {

                    throw new Error(
                        "Connexion impossible."
                    );

                }


                /*
                 * Vérification du profil
                 */

                const {
                    data: profile,
                    error:
                        profileError
                } =
                    await supabaseClient
                        .from("profiles")
                        .select(
                            "status,role"
                        )
                        .eq(
                            "id",
                            data.user.id
                        )
                        .maybeSingle();


                if (
                    profileError
                ) {

                    console.warn(
                        "PROFILE ERROR:",
                        profileError.message
                    );

                }


                /*
                 * Compte bloqué
                 */

                if (
                    profile &&
                    profile.status ===
                    "blocked"
                ) {

                    await supabaseClient
                        .auth
                        .signOut();


                    throw new Error(
                        "Votre compte est bloqué."
                    );

                }


                showMessage(
                    "✅ Connexion réussie !",
                    "success-message"
                );


                setTimeout(
                    () => {

                        window.location.href =
                            "index.html";

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                showMessage(
                    error.message ||
                    "Erreur de connexion.",
                    "error-message"
                );


            } finally {

                button.disabled = false;

                button.textContent =
                    "Se connecter";

            }

        }
    );


/* ==========================================
   START
========================================== */

initSupabase();

</script>

</body>

</html>
