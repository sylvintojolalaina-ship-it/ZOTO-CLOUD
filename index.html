<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZOTO CLOUD - Stockage Cloud Gratuit</title>

<meta name="description"
content="ZOTO CLOUD est une plateforme de stockage cloud simple, rapide et sécurisée pour sauvegarder et gérer vos fichiers en ligne.">

<meta name="robots" content="index, follow">

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#2563eb">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   GLOBAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

:root{
    --text-color:#222;
    --muted-color:#666;
    --card-bg:rgba(255,255,255,.94);
    --border-color:rgba(0,0,0,.12);
}

body{
    background:#f4f7fb;
    color:var(--text-color);
    min-height:100vh;
    transition:color .3s,background .3s;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.08);
    z-index:-1;
    pointer-events:none;
}

h1,h2,h3,p,strong,label{
    color:var(--text-color);
}


/* =========================
   AFFICHAGE FICHIERS
========================= */

.view-options{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.view-options .section-title{
    margin-bottom:0;
}

.view-select{
    padding:10px 14px;
    border:1px solid var(--border-color);
    border-radius:9px;
    background:var(--card-bg);
    color:var(--text-color);
    cursor:pointer;
    font-size:14px;
}


/* LISTE */

.file-list.list-view{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}


/* GRILLE */

.file-list.grid-view{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(240px,1fr)
        );
    gap:16px;
}

.file-list.grid-view .file{
    flex-direction:column;
    align-items:flex-start;
    min-height:180px;
}

.file-list.grid-view .file-info{
    width:100%;
    flex-direction:column;
    align-items:flex-start;
}

.file-list.grid-view .file-icon{
    font-size:45px;
}


/* =========================
   BOUTON ...
========================= */

.file-menu-button{
    border:none;

    background:rgba(100,116,139,.12);

    color:var(--text-color);

    width:42px;
    height:42px;

    border-radius:10px;

    cursor:pointer;

    font-size:24px;

    flex-shrink:0;

    transition:.2s;
}

.file-menu-button:hover{
    background:rgba(37,99,235,.15);
}

.file-menu-button:active{
    transform:scale(.95);
}


/* =========================
   MENU CONTEXTUEL
========================= */

.file-context-menu{

    display:none;

    position:fixed;

    z-index:100000;

    min-width:210px;

    max-width:calc(100vw - 20px);

    background:var(--card-bg);

    border:
        1px solid
        var(--border-color);

    border-radius:12px;

    padding:8px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.22);

    backdrop-filter:blur(12px);

}

.file-context-menu button{

    width:100%;

    border:none;

    background:transparent;

    color:var(--text-color);

    padding:12px;

    border-radius:8px;

    text-align:left;

    cursor:pointer;

    font-size:14px;

    transition:.2s;

}

.file-context-menu button:hover{

    background:
        rgba(37,99,235,.12);

}

.file-context-menu button:active{

    transform:scale(.98);

}

.file-context-menu .danger{

    color:#dc2626;

}


/* =========================
   HEADER
========================= */

header{
    height:70px;

    background:var(--card-bg);

    color:var(--text-color);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    border-bottom:
        1px solid
        var(--border-color);

    gap:15px;

    position:sticky;

    top:0;

    z-index:100;

    backdrop-filter:blur(10px);
}

.logo{
    font-size:23px;

    font-weight:bold;

    white-space:nowrap;
}

.search{
    width:350px;

    padding:12px 18px;

    border:
        1px solid
        var(--border-color);

    border-radius:25px;

    outline:none;

    background:
        rgba(255,255,255,.9);

    color:#222;
}

.user-area{
    display:flex;

    align-items:center;

    gap:8px;
}

.user{
    font-weight:bold;

    max-width:200px;

    overflow:hidden;

    text-overflow:ellipsis;
}

.logout{
    border:none;

    background:#ef4444;

    color:white;

    padding:9px 14px;

    border-radius:8px;

    cursor:pointer;
}

.menu-button{
    display:none;

    border:none;

    background:#2563eb;

    color:white;

    padding:10px 13px;

    border-radius:8px;

    font-size:20px;

    cursor:pointer;
}


/* =========================
   NOTIFICATION
========================= */

.notification-popup{
    display:none;

    position:fixed;

    top:20px;

    right:20px;

    width:350px;

    max-width:
        calc(100% - 40px);

    background:white;

    color:#222;

    border-radius:14px;

    padding:17px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.20);

    z-index:99999;

    border-left:
        5px solid
        #2563eb;

    animation:
        notificationIn
        .3s ease;
}

.notification-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:12px;
}

.notification-title{
    font-size:17px;

    font-weight:bold;

    color:#222;
}

.notification-close{
    border:none;

    background:transparent;

    font-size:20px;

    cursor:pointer;

    color:#6b7280;
}

#notificationText{
    color:#374151;

    line-height:1.5;

    word-break:break-word;
}

@keyframes notificationIn{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================
   LAYOUT
========================= */

.container{
    display:flex;

    min-height:
        calc(100vh - 70px);
}

aside{
    width:230px;

    background:var(--card-bg);

    color:var(--text-color);

    padding:20px 15px;

    border-right:
        1px solid
        var(--border-color);

    flex-shrink:0;

    backdrop-filter:blur(10px);
}

aside button{
    width:100%;

    padding:13px;

    margin-bottom:8px;

    border:none;

    border-radius:10px;

    background:transparent;

    color:var(--text-color);

    text-align:left;

    cursor:pointer;

    font-size:15px;
}

aside button:hover{
    background:
        rgba(37,99,235,.12);
}

.upload{
    background:#2563eb !important;

    color:white !important;

    text-align:center !important;
}

.settings-btn{
    margin-top:15px;

    border-top:
        1px solid
        var(--border-color)
        !important;

    padding-top:18px !important;
}

main{
    flex:1;

    padding:30px;

    min-width:0;
}

.welcome{
    color:
        var(--muted-color)
        !important;

    margin:
        8px 0
        25px;
}

.status{
    background:var(--card-bg);

    color:var(--text-color);

    padding:15px;

    border-radius:10px;

    margin-bottom:20px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.08);
}


/* =========================
   STORAGE
========================= */

.storage-box{
    background:var(--card-bg);

    color:var(--text-color);

    padding:20px;

    border-radius:15px;

    margin-bottom:25px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.08);
}

.storage-header{
    display:flex;

    justify-content:space-between;

    gap:15px;

    margin-bottom:12px;
}

.storage-bar{
    width:100%;

    height:14px;

    background:#e5e7eb;

    border-radius:20px;

    overflow:hidden;
}

.storage-progress{
    height:100%;

    background:#2563eb;

    border-radius:20px;

    transition:
        width .4s ease;
}

.storage-details{
    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-top:10px;

    color:var(--muted-color);

    font-size:13px;
}

.settings-storage-title{
    margin-bottom:15px;
}


/* =========================
   CATEGORIES
========================= */

.categories{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

    margin-bottom:30px;
}

.category{
    background:var(--card-bg);

    color:var(--text-color);

    padding:25px;

    border-radius:15px;

    cursor:pointer;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.08);

    transition:.2s;
}

.category:hover{
    transform:
        translateY(-4px);
}

.category-icon{
    font-size:42px;

    margin-bottom:15px;
}

.category h3{
    margin-bottom:7px;
}

.category p{
    color:
        var(--muted-color)
        !important;
}


/* =========================
   FILES
========================= */

.file-list{
    display:grid;

    gap:12px;
}

.file{
    background:var(--card-bg);

    color:var(--text-color);

    padding:15px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.08);

    cursor:pointer;

    user-select:none;

    -webkit-user-select:none;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.file:hover{
    box-shadow:
        0 4px 14px
        rgba(0,0,0,.12);
}

.file:active{
    transform:scale(.995);
}

.file-info{
    display:flex;

    align-items:center;

    gap:15px;

    min-width:0;
}

.file-icon{
    font-size:35px;

    flex-shrink:0;
}

.file-name{
    font-weight:bold;

    color:var(--text-color);

    word-break:break-word;
}

.file-details{
    color:var(--muted-color);

    font-size:13px;

    margin-top:5px;
}


/* =========================
   ANCIENS ACTIONS
   CONSERVES POUR CORBEILLE
========================= */

.actions{
    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

.actions button{
    border:none;

    color:white;

    padding:9px 13px;

    border-radius:8px;

    cursor:pointer;
}

.view{
    background:#16a34a;
}

.download{
    background:#2563eb;
}

.trash{
    background:#f59e0b;
}

.restore{
    background:#16a34a;
}

.delete-permanent{
    background:#dc2626;
}


/* =========================
   BACK
========================= */

.back{
    border:none;

    background:#64748b;

    color:white;

    padding:10px 16px;

    border-radius:8px;

    cursor:pointer;

    margin-bottom:20px;
}

.empty{
    background:var(--card-bg);

    color:var(--muted-color);

    padding:30px;

    border-radius:12px;

    text-align:center;
}


/* =========================
   PREVIEW
========================= */

.preview{
    display:none;

    position:fixed;

    z-index:9999;

    inset:0;

    background:
        rgba(0,0,0,.75);

    align-items:center;

    justify-content:center;

    padding:20px;
}

.preview-box{
    background:white;

    color:#222;

    width:95%;

    max-width:1000px;

    max-height:90vh;

    border-radius:15px;

    padding:15px;

    position:relative;

    overflow:auto;
}

.close{
    position:absolute;

    right:15px;

    top:10px;

    border:none;

    background:#ef4444;

    color:white;

    font-size:18px;

    width:38px;

    height:38px;

    border-radius:50%;

    cursor:pointer;
}

#previewContent{
    margin-top:45px;

    text-align:center;
}

#previewContent img{
    max-width:100%;

    max-height:75vh;

    border-radius:10px;
}

#previewContent video{
    width:100%;

    max-height:75vh;
}

#previewContent audio{
    width:100%;
}

#previewContent iframe{
    width:100%;

    height:75vh;

    border:none;
}


/* =========================
   SETTINGS
========================= */

.settings-panel{
    background:var(--card-bg);

    color:var(--text-color);

    max-width:700px;

    padding:25px;

    border-radius:15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.08);
}

.setting-group{
    margin-bottom:25px;

    padding-bottom:20px;

    border-bottom:
        1px solid
        var(--border-color);
}

.setting-group:last-child{
    border-bottom:none;
}

.setting-group h3{
    margin-bottom:15px;
}

.setting-group label{
    display:block;

    margin-bottom:7px;

    font-weight:bold;
}

.setting-group p{
    color:
        var(--muted-color)
        !important;
}

.setting-input,
.setting-select{
    width:100%;

    padding:12px;

    border:
        1px solid
        var(--border-color);

    border-radius:8px;

    margin-bottom:10px;

    background:
        rgba(255,255,255,.9);

    color:#222;
}

.setting-button{
    border:none;

    background:#2563eb;

    color:white;

    padding:11px 18px;

    border-radius:8px;

    cursor:pointer;
}

.danger-button{
    background:#ef4444;
}

.wallpaper-preview{
    width:100%;

    height:150px;

    border-radius:12px;

    background-size:cover;

    background-position:center;

    margin:10px 0;

    border:
        1px solid
        var(--border-color);
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .categories{
        grid-template-columns:
            repeat(2,1fr);
    }

    .search{
        width:250px;
    }

}


@media(max-width:700px){

    header{
        height:auto;

        min-height:65px;

        padding:10px 15px;

        flex-wrap:wrap;
    }

    .menu-button{
        display:block;
    }

    .logo{
        font-size:19px;
    }

    .user{
        display:none;
    }

    .search{
        width:100%;

        order:4;
    }

    .container{
        flex-direction:column;
    }

    aside{
        display:none;

        width:100%;

        border-right:none;

        border-bottom:
            1px solid
            var(--border-color);

        padding:12px;
    }

    aside.mobile-open{
        display:block;
    }

    main{
        padding:15px;
    }

    .categories{
        grid-template-columns:
            1fr 1fr;

        gap:10px;
    }

    .category{
        padding:17px;
    }

    .category-icon{
        font-size:32px;
    }

    .file{
        flex-direction:row;

        align-items:center;
    }

    .file-info{
        flex:1;
    }

    .storage-details{
        flex-direction:column;
    }

    .settings-panel{
        padding:18px;
    }

    .notification-popup{
        top:10px;

        right:10px;

        width:
            calc(100% - 20px);
    }

    .file-context-menu{
        min-width:200px;
    }

    /* PHONE : Téléverser ihany no aseho */
#sidebar > button:not(.upload):not(.folder-upload){
    display:none;
}

/* Afenina amin'ny téléphone */
#pageTitle,
.welcome{
    display:none;
}

/* Sidebar miseho */
aside{
    display:block;
    width:100%;
    border-right:none;
    border-bottom:1px solid var(--border-color);
    padding:12px;
}

}


@media(max-width:430px){

    .categories{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:17px;
    }

    .logout{
        padding:8px 10px;

        font-size:12px;
    }

}


/* =========================
   TOUCH
========================= */

@media(hover:none){

    .file:hover{
        box-shadow:
            0 2px 8px
            rgba(0,0,0,.08);
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <button
        class="menu-button"
        onclick="toggleMenu()">

        ☰

    </button>


    <div class="logo">
        ☁️ ZOTO CLOUD
    </div>


    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔍 Rechercher un fichier..."
        oninput="searchFiles()"
    >


    <div class="user-area">

        <span
            id="userEmail"

        </span>


        <button
            class="logout"

            Déconnexion

        </button>

    </div>

</header>


<!-- =========================
     MENU ACTION FICHIER
========================= -->

<div
    id="fileContextMenu"
    class="file-context-menu">

    <button id="fileMenuView">

        👁️ Voir

    </button>


    <button id="fileMenuDownload">

        📥 Télécharger

    </button>


    <button
        id="fileMenuDelete"
        class="danger">

        🗑️ Supprimer

    </button>

</div>


<!-- =========================
     NOTIFICATION
========================= -->

<div
    id="notificationPopup"
    class="notification-popup">

    <div class="notification-header">

        <div class="notification-title">
            📢 Notification ZOTO CLOUD
        </div>


        <button
            class="notification-close"
            onclick="closeNotification()">

            ✕

        </button>

    </div>


    <div id="notificationText">
        Notification...
    </div>

</div>


<!-- =========================
     LAYOUT
========================= -->

<div class="container">


<aside id="sidebar">


    <button
        class="upload"
        onclick="
            document
            .getElementById('fileInput')
            .click()
        ">

        📤 Téléverser fichiers

    </button>


    <input
        type="file"
        id="fileInput"
        multiple
        style="display:none"
        onchange="uploadFiles(this.files)"
    >


    <button class="folder-upload" onclick="document.getElementById('folderInput').click()">
    📁 Téléverser un dossier
</button>


    <input
        type="file"
        id="folderInput"
        webkitdirectory
        directory
        multiple
        style="display:none"
        onchange="uploadFiles(this.files,true)"
    >


    <button onclick="showHome()">

        📁 Mes fichiers

    </button>


    <button onclick="openCategory('image')">

        🖼️ Images

        🎥 Vidéos

    </button>


    <button onclick="openCategory('document')">

        📄 Documents

    </button>


    <button onclick="openCategory('pdf')">

        📕 PDF

    </button>


    <button onclick="openCategory('audio')">

        🎵 Audio

    </button>


    <button onclick="openCategory('other')">

        📦 Autres fichiers

    </button>


    <button onclick="showTrash()">

        🗑️ Corbeille

    </button>


    <button
        class="settings-btn"
        onclick="showSettings()">

        ⚙️ Paramètres

    </button>

</aside>


<!-- =========================
     MAIN
========================= -->

<main>

    <h1 id="pageTitle">

        Bienvenue sur ZOTO CLOUD 👋

    </h1>


    <p class="welcome">

        Votre espace personnel de stockage en ligne.

    </p>


    <div
        id="status"
        class="status">

        ☁️ Chargement...

    </div>


    <div id="content"></div>

</main>

</div>


<!-- =========================
     PREVIEW
========================= -->

<div
    id="preview"
    class="preview">

    <div class="preview-box">

        <button
            class="close"
            onclick="closePreview()">

            ✕

        </button>


        <div id="previewContent"></div>

    </div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://sbsixeaxhbvxezoylong.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__ZUPst8S6Vnl0U6jFhuUCw_g8bvahh6";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   VARIABLES
========================= */

let allFiles = [];

let currentFiles = [];

let currentCategory = null;

let currentUser = null;


/*
    Quota personnelle :
    1 GB
*/

const TOTAL_STORAGE =
1024 * 1024 * 1024;


/* =========================
   USER
========================= */

async function getUser(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(error || !data.user){

        window.location.href =
            "/auth.html";

        return null;
    }


    currentUser =
        data.user;


    const email =
        document.getElementById(
            "userEmail"
        );


    if(email){

        email.textContent =
            "👤 " +
            (
                currentUser.email || ""
            );

    }


    return currentUser;

}


/* =========================
   MENU MOBILE
========================= */

function toggleMenu(){

    document
        .getElementById("sidebar")
        .classList
        .toggle("mobile-open");

}


/* =========================
   UPLOAD
========================= */

async function uploadFiles(
    files,
    isFolder=false
){

    if(
        !files ||
        !files.length
    ){

        return;

    }


    const user =
        await getUser();


    if(!user) return;


    const status =
        document.getElementById(
            "status"
        );


    const fileArray =
        Array.from(files);


    let success = 0;

    let failed = 0;


    for(
        let i=0;
        i<fileArray.length;
        i++
    ){

        const file =
            fileArray[i];


        status.textContent =
            `⏳ Téléversement ${i+1}/${fileArray.length} : ${file.name}`;


        let relativePath =
            file.webkitRelativePath ||
            file.name;


        relativePath =
            relativePath
            .replace(/\\/g,"/")
            .replace(/^\/+/,"");


        const safePath =
            relativePath
            .split("/")
            .map(part =>
                part.replace(
                    /[^\w.\- ]/g,
                    "_"
                )
            )
            .join("/");


        const filePath =
            user.id +
            "/" +
            Date.now() +
            "_" +
            safePath;


        const {
            data,
            error
        } =
        await supabaseClient
            .storage
            .from("zoto-files")
            .upload(
                filePath,
                file
            );


        if(error){

            console.error(
                "UPLOAD ERROR:",
                error
            );

            failed++;

            continue;

        }


        const {
            error:dbError
        } =
        await supabaseClient
            .from("files")
            .insert({

                user_id:
                    user.id,

                file_name:
                    relativePath,

                file_path:
                    data.path,

                file_type:
                    file.type ||
                    "application/octet-stream",

                file_size:
                    file.size

            });


        if(dbError){

            console.error(
                "DATABASE ERROR:",
                dbError
            );

            failed++;

            continue;

        }


        success++;

    }


    status.textContent =
        `✅ ${success} fichier(s) envoyé(s)` +
        (
            failed
                ? ` • ❌ ${failed} échec(s)`
                : ""
        );


    document.getElementById(
        "fileInput"
    ).value = "";


    document.getElementById(
        "folderInput"
    ).value = "";


    await loadFiles();

}


/* =========================
   LOAD FILES
========================= */

async function loadFiles(){

    const user =
        await getUser();


    if(!user) return;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("files")
        .select("*")
        .eq(
            "user_id",
            user.id
        )
        .is(
            "deleted_at",
            null
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        document.getElementById(
            "status"
        ).textContent =
            "❌ " +
            error.message;

        return;

    }


    allFiles =
        data || [];


    currentFiles =
        allFiles;


    showHome();

}


/* =========================
   STORAGE
========================= */

function getUsedStorage(){

    return allFiles.reduce(
        (
            total,
            file
        ) =>
            total +
            Number(
                file.file_size || 0
            ),
        0
    );

}


function getFreeStorage(){

    return Math.max(
        TOTAL_STORAGE -
        getUsedStorage(),
        0
    );

}


function getStoragePercentage(){

    return Math.min(
        (
            getUsedStorage() /
            TOTAL_STORAGE
        ) * 100,
        100
    );

}


function storageSettingsHTML(){

    const used =
        getUsedStorage();


    const free =
        getFreeStorage();


    const percentage =
        getStoragePercentage();


    return `

        <div class="setting-group">

            <h3 class="settings-storage-title">

                💾 Stockage ZOTO CLOUD

            </h3>


            <div class="storage-box">

                <div class="storage-header">

                    <strong>
                        Espace utilisé
                    </strong>

                    <strong>

                        ${formatSize(used)}
                        /
                        ${formatSize(TOTAL_STORAGE)}

                    </strong>

                </div>


                <div class="storage-bar">

                    <div
                        class="storage-progress"
                        style="
                            width:${percentage}%
                        "
                    ></div>

                </div>


                <div class="storage-details">

                    <span>

                        Utilisé :
                        <strong>
                            ${formatSize(used)}
                        </strong>

                    </span>


                    <span>

                        Libre :
                        <strong>
                            ${formatSize(free)}
                        </strong>

                    </span>


                    <span>

}

/* =========================
   CLASSIFICATION
========================= */

function belongsTo(
    file,
    category
){

    const type =
        file.file_type || "";


    const name =
        file.file_name || "";


    if(category === "image")

        return type.startsWith(
            "image/"
        );


    if(category === "video")

        return type.startsWith(
            "video/"
        );


    if(category === "audio")

        return type.startsWith(
            "audio/"
        );


    if(category === "pdf")

        return type ===
            "application/pdf";


    if(category === "document"){

        return (

            type.includes("word") ||

            type.includes("document") ||

            type.includes("excel") ||

            type.includes(
                "spreadsheet"
            ) ||

            type.includes(
                "powerpoint"
            ) ||

            type.includes(
                "presentation"
            ) ||

            /\.(doc|docx|xls|xlsx|ppt|pptx)$/i
                .test(name)

        );

    }


    if(category === "other"){

        return !(

            belongsTo(
                file,
                "image"
            ) ||

            belongsTo(
                file,
                "video"
            ) ||

            belongsTo(
                file,
                "audio"
            ) ||

            belongsTo(
                file,
                "pdf"
            ) ||

            belongsTo(
                file,
                "document"
            )

        );

    }


    return false;

}

/* =========================
   MODE AFFICHAGE
========================= */

function getViewModeKey(){

    return currentUser

        ? "zoto_view_mode_" +
          currentUser.id

        : "zoto_view_mode";

}


function getViewMode(){

    return localStorage.getItem(
        getViewModeKey()
    ) || "list";

}


function changeViewMode(mode){

    if(
        mode !== "list" &&
        mode !== "grid"
    ){

        mode = "list";

    }


    localStorage.setItem(
        getViewModeKey(),
        mode
    );


    const list =
        document.getElementById(
            "fileList"
        );


    if(!list) return;


    list.classList.remove(
        "list-view",
        "grid-view"
    );


    list.classList.add(
        mode + "-view"
    );

}


/* =========================
   MENU FICHIER
========================= */

function openFileMenu(
    file,
    x = null,
    y = null
){

    const menu =
        document.getElementById(
            "fileContextMenu"
        );


    if(!menu) return;


    /* =========================
       VOIR
    ========================= */

    document.getElementById(
        "fileMenuView"
    ).onclick = function(){

        closeFileMenu();


        viewFile(
            encodeURIComponent(
                file.file_path
            ),
            encodeURIComponent(
                file.file_type || ""
            ),
            encodeURIComponent(
                file.file_name
            )
        );

    };


    /* =========================
       TELECHARGER
    ========================= */

    document.getElementById(
        "fileMenuDownload"
    ).onclick = function(){

        closeFileMenu();


        downloadFile(
            encodeURIComponent(
                file.file_path
            ),
            encodeURIComponent(
                file.file_name
            )
        );

    };


    /* =========================
       SUPPRIMER
    ========================= */

    document.getElementById(
        "fileMenuDelete"
    ).onclick = function(){

        closeFileMenu();


        moveToTrash(
            file.id
        );

    };


    menu.style.display =
        "block";


    /*
       Position
    */

    let posX =
        x === null
            ? 20
            : x;


    let posY =
        y === null
            ? 20
            : y;


    const menuWidth =
        210;


    const menuHeight =
        175;


    if(
        posX +
        menuWidth >
        window.innerWidth
    ){

        posX =
            window.innerWidth -
            menuWidth -
            10;

    }


    if(
        posY +
        menuHeight >
        window.innerHeight
    ){

        posY =
            window.innerHeight -
            menuHeight -
            10;

    }


    menu.style.left =
        Math.max(
            10,
            posX
        ) + "px";


    menu.style.top =
        Math.max(
            10,
            posY
        ) + "px";

}


/* =========================
   FERMER MENU
========================= */

function closeFileMenu(){

    const menu =
        document.getElementById(
            "fileContextMenu"
        );


    if(menu){

        menu.style.display =
            "none";

    }

}

document.addEventListener(

/* =========================
   DISPLAY FILES
========================= */

function displayFiles(files){

    const list =
        document.getElementById(
            "fileList"
        );


    if(!list) return;


    if(!files.length){

        list.innerHTML = `

            <div class="empty">

                📂 Aucun fichier.

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    const mode =
        getViewMode();


    list.classList.add(
        mode + "-view"
    );


    const selector =
        document.getElementById(
            "viewModeSelect"
        );


    if(selector){

        selector.value =
            mode;

    }


    files.forEach(
        file => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "file";


            div.innerHTML = `

                <div class="file-info">

                    <div class="file-icon">

                        ${getIcon(file)}

                    </div>


                    <div>

                        <div class="file-name">

                            ${escapeHtml(
                                file.file_name
                            )}

                        </div>


                        <div class="file-details">

                            ${formatSize(
                                file.file_size
                            )}

                            •

                            ${new Date(
                                file.created_at
                            ).toLocaleString(
                                "fr-FR"
                            )}

                        </div>

                    </div>

                </div>


                <button
                    class="file-menu-button"
                    title="Actions"
                    aria-label="Actions">

                    ⋮

                </button>

            `;


            const menuButton =
                div.querySelector(
                    ".file-menu-button"
                );


            /* =========================
               BOUTON ⋮
            ========================= */

            menuButton.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();


                    const rect =
                        menuButton
                        .getBoundingClientRect();


                    openFileMenu(
                        file,
                        rect.left,
                        rect.bottom + 5
                    );

                }
            );


            /* =========================
               CLICK DROIT
            ========================= */

            div.addEventListener(
                "contextmenu",
                function(event){

                    event.preventDefault();


                    openFileMenu(
                        file,
                        event.clientX,
                        event.clientY
                    );

                }
            );


            /* =========================
               DOUBLE CLICK
            ========================= */

            div.addEventListener(
                "dblclick",
                function(event){

                    event.preventDefault();


                    openFileMenu(
                        file,
                        event.clientX || 20,
                        event.clientY || 20
                    );

                }
            );


            /* =========================
               MAINTENIR ANDROID
            ========================= */

            let longPressTimer =
                null;


            let touchStartX =
                0;


            let touchStartY =
                0;


            div.addEventListener(
                "touchstart",
                function(event){

                    const touch =
                        event.touches[0];


                    touchStartX =
                        touch.clientX;


                    touchStartY =
                        touch.clientY;


                    longPressTimer =
                        setTimeout(
                            function(){

                                openFileMenu(
                                    file,
                                    touchStartX,
                                    touchStartY
                                );

                            },
                            600
                        );

                },
                {
                    passive:true
                }
            );


            div.addEventListener(
                "touchend",
                function(){

                    clearTimeout(
                        longPressTimer
                    );

                }
            );


            div.addEventListener(
                "touchcancel",
                function(){

                    clearTimeout(
                        longPressTimer
                    );

                }
            );


            div.addEventListener(
                "touchmove",
                function(event){

                    const touch =
                        event.touches[0];


                    const distance =
                        Math.sqrt(

                            Math.pow(
                                touch.clientX -
                                touchStartX,
                                2
                            )

                            +

                            Math.pow(
                                touch.clientY -
                                touchStartY,
                                2
                            )

                        );


                    if(
                        distance > 10
                    ){

                        clearTimeout(
                            longPressTimer
                        );

                    }

                },
                {
                    passive:true
                }
            );


            list.appendChild(
                div
            );

        }
    );

}


/* =========================
   ICON
========================= */

function getIcon(file){

    const type =
        file.file_type || "";


    if(
        type.startsWith(
            "image/"
        )
    )

        return "🖼️";


    if(
        type.startsWith(
            "video/"
        )
    )

        return "🎥";


    if(
        type.startsWith(
            "audio/"
        )
    )

        return "🎵";


    if(
        type ===
        "application/pdf"
    )

        return "📕";


    if(
        belongsTo(
            file,
            "document"
        )
    )

        return "📄";


    return "📦";

}

/* =========================
   DELETE FOREVER
========================= */

async function deleteForever(
    id,
    pathEncoded
){

    if(!confirm(
        "⚠️ Supprimer définitivement ce fichier ?"
    ))

        return;


    const path =
        decodeURIComponent(
            pathEncoded
        );


    const {
        error:storageError
    } =
    await supabaseClient
        .storage
        .from("zoto-files")
        .remove([
            path
        ]);


    if(storageError){

        alert(
            storageError.message
        );

        return;

    }


    const {
        error:dbError
    } =
    await supabaseClient
        .from("files")
        .delete()
        .eq(
            "id",
            id
        );


    if(dbError){

        alert(
            dbError.message
        );

        return;

    }


    document.getElementById(
        "status"
    ).textContent =
        "❌ Fichier supprimé définitivement.";


    await showTrash();

}


/* =========================
   VIEW
========================= */

async function viewFile(
    pathEncoded,
    typeEncoded,
    nameEncoded
){

    const path =
        decodeURIComponent(
            pathEncoded
        );


    const type =
        decodeURIComponent(
            typeEncoded
        );


    const name =
        decodeURIComponent(
            nameEncoded
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .storage
        .from("zoto-files")
        .createSignedUrl(
            path,
            3600
        );


    if(error){

        alert(
            error.message
        );

        return;

    }


    const url =
        data.signedUrl;


    const content =
        document.getElementById(
            "previewContent"
        );


    content.innerHTML = "";


    if(
        type.startsWith(
            "image/"
        )
    ){

        content.innerHTML = `

            <h2>

                ${escapeHtml(name)}

            </h2>


            <br>


            <img
                src="${url}"
                alt="${escapeHtml(name)}">

        `;

    }

    else if(
        type.startsWith(
            "video/"
        )
    ){

        content.innerHTML = `

            <h2>

                ${escapeHtml(name)}

            </h2>


            <br>


            <video
                src="${url}"
                controls>
            </video>

        `;

    }

    else if(
        type.startsWith(
            "audio/"
        )
    ){

        content.innerHTML = `

            <h2>

                ${escapeHtml(name)}

            </h2>


            <br>


            <audio
                src="${url}"
                controls>
            </audio>

        `;

    }

    else if(
        type ===
        "application/pdf"
    ){

        content.innerHTML = `

            <h2>

                ${escapeHtml(name)}

            </h2>


            <br>


            <iframe
                src="${url}">
            </iframe>

        `;

    }

    else{

        content.innerHTML = `

            <h2>

                📦
                ${escapeHtml(name)}

            </h2>


            <br>


            <p>

                Aperçu direct non disponible.

            </p>

        `;

    }


    document.getElementById(
        "preview"
    ).style.display =
        "flex";

}

    const name =
        decodeURIComponent(
            nameEncoded
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .storage
        .from("zoto-files")
        .download(
            path
        );


    if(error){

        alert(
            error.message
        );

        return;

    }


    const url =
        URL.createObjectURL(
            data
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        name;


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    URL.revokeObjectURL(
        url
    );

}

            .toLowerCase()
            .trim();


    if(!value){

            openCategory(
                currentCategory

        else

        return;

    }


    const results =
        allFiles.filter(
            file =>

                (
                    file.file_name ||
                    ""
                )
                .toLowerCase()
                .includes(value)
        );


    document.getElementById(
        "pageTitle"
    ).textContent =
        "🔍 Résultats de recherche";


    renderFiles(
        results,
        "🔍 Résultats"

}

function changeWallpaper(
    file
){

    if(!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            const image =
                event.target.result;


            localStorage.setItem(
                "zoto_wallpaper_" +
                currentUser.id,
                image
            );


            applyWallpaper(
                image
            );


            showWallpaperPreview();

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================
   AUTO TEXT COLOR
========================= */

function applyWallpaper(
    image
){

    if(!image){

        document.body.style
            .backgroundImage = "";


        setTextTheme(
            false
        );


        return;

    }


    document.body.style
        .backgroundImage =
        `url("${image}")`;


    document.body.style
        .backgroundSize =
        "cover";


    document.body.style
        .backgroundAttachment =
        "fixed";


    document.body.style
        .backgroundPosition =
        "center";


    detectWallpaperBrightness(
        image
    );

}


function detectWallpaperBrightness(
    image
){

    const img =
        new Image();


    img.onload =
        function(){

            const canvas =
                document.createElement(
                    "canvas"
                );


            const ctx =
                canvas.getContext(
                    "2d"
                );


            const width =
                100;


            const height =
                100;


            canvas.width =
                width;


            canvas.height =
                height;


            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );


            const data =
                ctx.getImageData(
                    0,
                    0,
                    width,
                    height
                ).data;


            let total =
                0;


            let count =
                0;


            for(
                let i=0;
                i<data.length;
                i+=4
            ){

                const r =
                    data[i];


                const g =
                    data[i+1];


                const b =
                    data[i+2];


                const brightness =
                    (
                        r*299 +
                        g*587 +
                        b*114
                    ) / 1000;


                total +=
                    brightness;


                count++;

            }


            const average =
                total / count;


            if(
                average > 145
            )

                setTextTheme(
                    false
                );

            else

                setTextTheme(
                    true
                );

        };


    img.src =
        image;

}

/* =========================
   NOTIFICATIONS
========================= */

async function loadNotifications(){

    if(!currentUser)
        return;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("notifications")
        .select(
            "id,message,created_at"
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .eq(
            "is_read",
            false
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        )
        .limit(1);


    if(error){

        console.error(
            "NOTIFICATION ERROR:",
            error
        );

        return;

    }


    if(
        !data ||
        data.length === 0
    )

        return;


    const notification =
        data[0];


    const text =
        document.getElementById(
            "notificationText"
        );


    const popup =
        document.getElementById(
            "notificationPopup"
        );


    if(text)

        text.textContent =
            notification.message;


    if(popup)

        popup.style.display =
            "block";


    const {
        error:updateError
    } =
        await supabaseClient
            .from("notifications")
            .update({
                is_read:true
            })
            .eq(
                "id",
                notification.id
            );


    if(updateError){

        console.error(
            "READ NOTIFICATION ERROR:",
            updateError
        );

    }

}


function closeNotification(){

    const popup =
        document.getElementById(
            "notificationPopup"
        );


    if(popup)

        popup.style.display =
            "none";

}

/* =========================
   FORMAT SIZE
========================= */

function formatSize(bytes){

    if(!bytes)
        return "0 B";


    const units = [
        "B",
        "KB",
        "MB",
        "GB"
    ];


    let size =
        bytes;


    let i =
        0;


    while(
        size >= 1024 &&
        i <
        units.length - 1
    ){

        size /=
            1024;

        i++;

    }


    return (
        size.toFixed(2) +
        " " +
        units[i]
    );

}
