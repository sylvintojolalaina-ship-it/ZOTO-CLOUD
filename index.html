<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOTO CLOUD</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#222;
}

header{
    height:70px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    border-bottom:1px solid #ddd;
    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.search{
    width:350px;
    padding:12px 18px;
    border:1px solid #ddd;
    border-radius:25px;
    outline:none;
}

.user{
    font-weight:bold;
}

.logout{
    border:none;
    background:#ef4444;
    color:white;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    margin-left:8px;
}

.container{
    display:flex;
    min-height:calc(100vh - 70px);
}

aside{
    width:230px;
    background:white;
    padding:25px 15px;
    border-right:1px solid #ddd;
}

aside button{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:transparent;
    text-align:left;
    cursor:pointer;
    font-size:15px;
}

aside button:hover{
    background:#eef3ff;
}

.upload{
    background:#2563eb !important;
    color:white;
    text-align:center !important;
}

main{
    flex:1;
    padding:35px;
}

.welcome{
    color:#666;
    margin-bottom:30px;
}

.status{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:25px;
}

.section-title{
    margin-bottom:20px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:30px;
}

.category{
    background:white;
    padding:25px;
    border-radius:15px;
    cursor:pointer;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    transition:.2s;
}

.category:hover{
    transform:translateY(-4px);
}

.category-icon{
    font-size:42px;
    margin-bottom:15px;
}

.category h3{
    margin-bottom:7px;
}

.category p{
    color:#777;
}

.file-list{
    display:grid;
    gap:12px;
}

.file{
    background:white;
    padding:15px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.file-info{
    display:flex;
    align-items:center;
    gap:15px;
    min-width:0;
}

.file-icon{
    font-size:35px;
}

.file-name{
    font-weight:bold;
    word-break:break-word;
}

.file-details{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.actions button{
    border:none;
    color:white;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
}

.view{
    background:#16a34a;
}

.download{
    background:#2563eb;
}

.trash{
    background:#f59e0b;
}

.restore{
    background:#16a34a;
}

.delete-permanent{
    background:#dc2626;
}

.back{
    border:none;
    background:#64748b;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:20px;
}

.empty{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    color:#777;
}

.preview{
    display:none;
    position:fixed;
    z-index:9999;
    inset:0;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.preview-box{
    background:white;
    width:95%;
    max-width:1000px;
    max-height:90vh;
    border-radius:15px;
    padding:15px;
    position:relative;
    overflow:auto;
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    border:none;
    background:#ef4444;
    color:white;
    font-size:18px;
    width:38px;
    height:38px;
    border-radius:50%;
    cursor:pointer;
}

#previewContent{
    margin-top:45px;
    text-align:center;
}

#previewContent img{
    max-width:100%;
    max-height:75vh;
    border-radius:10px;
}

#previewContent video{
    width:100%;
    max-height:75vh;
}

#previewContent audio{
    width:100%;
}

#previewContent iframe{
    width:100%;
    height:75vh;
    border:none;
}

@media(max-width:900px){
    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    header{
        padding:15px;
    }

    .search{
        width:250px;
    }
}

@media(max-width:600px){
    header{
        height:auto;
        flex-wrap:wrap;
    }

    .search{
        width:100%;
        order:3;
    }

    .container{
        flex-direction:column;
    }

    aside{
        width:100%;
        border-right:none;
        border-bottom:1px solid #ddd;
    }

    .categories{
        grid-template-columns:1fr;
    }

    main{
        padding:20px;
    }

    .file{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        🧳 ZOTO CLOUD
    </div>

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔍 Rechercher un fichier..."
        oninput="searchFiles()"
    >

    <div>
        <span id="userEmail" class="user">
            👤 Chargement...
        </span>

        <button class="logout" onclick="logout()">
            Déconnexion
        </button>
    </div>

</header>


<div class="container">

<aside>

    <button
        class="upload"
        onclick="document.getElementById('fileInput').click()"
    >
        📤 Téléverser un fichier
    </button>

    <input
        type="file"
        id="fileInput"
        style="display:none"
        onchange="uploadFile()"
    >

    <button onclick="showHome()">
        📁 Mes fichiers
    </button>

    <button onclick="openCategory('image')">
        🖼️ Images
    </button>

    <button onclick="openCategory('video')">
        🎥 Vidéos
    </button>

    <button onclick="openCategory('document')">
        📄 Documents
    </button>

    <button onclick="openCategory('pdf')">
        📕 PDF
    </button>

    <button onclick="openCategory('audio')">
        🎵 Audio
    </button>

    <button onclick="openCategory('other')">
        📦 Autres fichiers
    </button>

    <button onclick="showTrash()">
        🗑️ Corbeille
    </button>

</aside>


<main>

    <h1 id="pageTitle">
       <marquee> Bienvenue sur ZOTO CLOUD 👋</marquee>
    </h1>

    <p class="welcome">
        Votre espace personnel de stockage en ligne.
    </p>

    <div id="status" class="status">
        ☁️ Chargement...
    </div>

    <div id="content"></div>

</main>

</div>


<div id="preview" class="preview">

    <div class="preview-box">

        <button
            class="close"
            onclick="closePreview()"
        >
            ✕
        </button>

        <div id="previewContent"></div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://sbsixeaxhbvxezoylong.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__ZUPst8S6Vnl0U6jFhuUCw_g8bvahh6";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


let allFiles = [];

let currentFiles = [];

let currentCategory = null;


/* UTILISATEUR */

async function getUser(){

    const {
        data:{user}
    } = await supabaseClient.auth.getUser();

    if(!user){

        window.location.href="/auth.html";

        return null;
    }

    document.getElementById("userEmail").textContent =
        "👤 " + user.email;

    return user;
}


/* UPLOAD */

async function uploadFile(){

    const input =
        document.getElementById("fileInput");

    if(!input.files.length) return;

    const file = input.files[0];

    const status =
        document.getElementById("status");

    status.textContent =
        "⏳ Téléversement de " + file.name + "...";


    const user = await getUser();

    if(!user) return;


    const filePath =
        user.id +
        "/" +
        Date.now() +
        "_" +
        file.name;


    const {
        data,
        error
    } =
    await supabaseClient.storage
    .from("zoto-files")
    .upload(filePath,file);


    if(error){

        status.textContent =
            "❌ " + error.message;

        return;
    }


    const {
        error:dbError
    } =
    await supabaseClient
    .from("files")
    .insert({

        user_id:user.id,

        file_name:file.name,

        file_path:data.path,

        file_type:file.type,

        file_size:file.size

    });


    if(dbError){

        status.textContent =
            "⚠️ Fichier envoyé mais erreur base de données.";

        console.error(dbError);

        return;
    }


    status.textContent =
        "✅ Fichier envoyé avec succès : " +
        file.name;

    input.value="";

    await loadFiles();

}


/* CHARGER */

async function loadFiles(){

    const user = await getUser();

    if(!user) return;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("files")
    .select("*")
    .eq("user_id",user.id)
    .is("deleted_at",null)
    .order("created_at",{ascending:false});


    if(error){

        console.error(error);

        return;
    }


    allFiles = data || [];

    currentFiles = allFiles;

    showHome();

}


/* PAGE PRINCIPALE */

function showHome(){

    currentCategory = null;

    document.getElementById("pageTitle").textContent =
        "Bienvenue sur ZOTO CLOUD 👋";

    document.getElementById("content").innerHTML = `

        <h2 class="section-title">
            📁 Mes fichiers
        </h2>

        <div class="categories">

            <div class="category"
                 onclick="openCategory('image')">

                <div class="category-icon">🖼️</div>

                <h3>Images</h3>

                <p>
                    ${countCategory("image")} fichiers
                </p>

            </div>


            <div class="category"
                 onclick="openCategory('video')">

                <div class="category-icon">🎥</div>

                <h3>Vidéos</h3>

                <p>
                    ${countCategory("video")} fichiers
                </p>

            </div>


            <div class="category"
                 onclick="openCategory('document')">

                <div class="category-icon">📄</div>

                <h3>Documents</h3>

                <p>
                    ${countCategory("document")} fichiers
                </p>

            </div>


            <div class="category"
                 onclick="openCategory('pdf')">

                <div class="category-icon">📕</div>

                <h3>PDF</h3>

                <p>
                    ${countCategory("pdf")} fichiers
                </p>

            </div>


            <div class="category"
                 onclick="openCategory('audio')">

                <div class="category-icon">🎵</div>

                <h3>Audio</h3>

                <p>
                    ${countCategory("audio")} fichiers
                </p>

            </div>


            <div class="category"
                 onclick="openCategory('other')">

                <div class="category-icon">📦</div>

                <h3>Autres fichiers</h3>

                <p>
                    ${countCategory("other")} fichiers
                </p>

            </div>

        </div>

    `;
}


/* COMPTER */

function countCategory(category){

    return allFiles.filter(
        file => belongsTo(file,category)
    ).length;
}


/* OUVRIR CATEGORIE */

function openCategory(category){

    currentCategory = category;

    let title="";

    if(category==="image") title="🖼️ Images";

    if(category==="video") title="🎥 Vidéos";

    if(category==="document") title="📄 Documents";

    if(category==="pdf") title="📕 PDF";

    if(category==="audio") title="🎵 Audio";

    if(category==="other") title="📦 Autres fichiers";


    document.getElementById("pageTitle").textContent =
        title;


    currentFiles =
        allFiles.filter(
            file => belongsTo(file,category)
        );


    renderFiles(currentFiles,title);

}


/* CLASSIFICATION */

function belongsTo(file,category){

    const type =
        file.file_type || "";

    const name =
        file.file_name || "";


    if(category==="image")
        return type.startsWith("image/");


    if(category==="video")
        return type.startsWith("video/");


    if(category==="audio")
        return type.startsWith("audio/");


    if(category==="pdf")
        return type==="application/pdf";


    if(category==="document"){

        return (
            type.includes("word") ||
            type.includes("document") ||
            type.includes("excel") ||
            type.includes("spreadsheet") ||
            type.includes("powerpoint") ||
            type.includes("presentation") ||
            /\.(doc|docx|xls|xlsx|ppt|pptx)$/i.test(name)
        );

    }


    if(category==="other"){

        return !(
            belongsTo(file,"image") ||
            belongsTo(file,"video") ||
            belongsTo(file,"audio") ||
            belongsTo(file,"pdf") ||
            belongsTo(file,"document")
        );

    }


    return false;
}


/* AFFICHER FICHIERS */

function renderFiles(files,title){

    const content =
        document.getElementById("content");


    content.innerHTML = `

        <button
            class="back"
            onclick="showHome()"
        >
            ← Retour à Mes fichiers
        </button>

        <h2 class="section-title">
            ${title}
        </h2>

        <div id="fileList"
             class="file-list"></div>

    `;


    displayFiles(files);

}


/* LISTE */

function displayFiles(files){

    const list =
        document.getElementById("fileList");


    if(!files.length){

        list.innerHTML = `
            <div class="empty">
                📂 Aucun fichier dans cette catégorie.
            </div>
        `;

        return;
    }


    list.innerHTML="";


    files.forEach(file=>{

        const div =
            document.createElement("div");

        div.className="file";


        div.innerHTML=`

            <div class="file-info">

                <div class="file-icon">
                    ${getIcon(file)}
                </div>

                <div>

                    <div class="file-name">
                        ${escapeHtml(file.file_name)}
                    </div>

                    <div class="file-details">
                        ${formatSize(file.file_size)}
                        •
                        ${new Date(file.created_at)
                        .toLocaleString("fr-FR")}
                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    class="view"
                    onclick="viewFile('${encodeURIComponent(file.file_path)}','${encodeURIComponent(file.file_type || "")}','${encodeURIComponent(file.file_name)}')"
                >
                    👁️ Voir
                </button>


                <button
                    class="download"
                    onclick="downloadFile('${encodeURIComponent(file.file_path)}','${encodeURIComponent(file.file_name)}')"
                >
                    📥 Télécharger
                </button>


                <button
                    class="trash"
                    onclick="moveToTrash('${file.id}')"
                >
                    🗑️ Supprimer
                </button>

            </div>

        `;


        list.appendChild(div);

    });

}


/* ICONE */

function getIcon(file){

    const type =
        file.file_type || "";

    if(type.startsWith("image/"))
        return "🖼️";

    if(type.startsWith("video/"))
        return "🎥";

    if(type.startsWith("audio/"))
        return "🎵";

    if(type==="application/pdf")
        return "📕";

    if(belongsTo(file,"document"))
        return "📄";

    return "📦";
}


/* CORBEILLE */

async function showTrash(){

    const user = await getUser();

    if(!user) return;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("files")
    .select("*")
    .eq("user_id",user.id)
    .not("deleted_at","is",null)
    .order("deleted_at",{ascending:false});


    if(error){

        alert(error.message);

        return;
    }


    document.getElementById("pageTitle").textContent =
        "🗑️ Corbeille";


    document.getElementById("content").innerHTML = `

        <button
            class="back"
            onclick="showHome()"
        >
            ← Retour à Mes fichiers
        </button>

        <h2 class="section-title">
            🗑️ Fichiers supprimés
        </h2>

        <div id="fileList"
             class="file-list"></div>

    `;


    displayTrash(data || []);

}


/* CORBEILLE AFFICHAGE */

function displayTrash(files){

    const list =
        document.getElementById("fileList");


    if(!files.length){

        list.innerHTML=`
            <div class="empty">
                🗑️ La corbeille est vide.
            </div>
        `;

        return;
    }


    files.forEach(file=>{

        const div =
            document.createElement("div");

        div.className="file";


        div.innerHTML=`

            <div class="file-info">

                <div class="file-icon">
                    ${getIcon(file)}
                </div>

                <div>

                    <div class="file-name">
                        ${escapeHtml(file.file_name)}
                    </div>

                    <div class="file-details">
                        Supprimé le
                        ${new Date(file.deleted_at)
                        .toLocaleString("fr-FR")}
                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    class="restore"
                    onclick="restoreFile('${file.id}')"
                >
                    ♻️ Restaurer
                </button>


                <button
                    class="delete-permanent"
                    onclick="deleteForever('${file.id}','${encodeURIComponent(file.file_path)}')"
                >
                    ❌ Supprimer définitivement
                </button>

            </div>

        `;


        list.appendChild(div);

    });

}


/* CORBEILLE */

async function moveToTrash(id){

    if(!confirm(
        "Voulez-vous déplacer ce fichier dans la corbeille ?"
    )) return;


    const {
        error
    } =
    await supabaseClient
    .from("files")
    .update({
        deleted_at:new Date().toISOString()
    })
    .eq("id",id);


    if(error){

        alert(error.message);

        return;
    }


    document.getElementById("status").textContent =
        "🗑️ Fichier déplacé dans la corbeille.";

    await loadFiles();

}


/* RESTAURER */

async function restoreFile(id){

    if(!confirm(
        "Voulez-vous restaurer ce fichier ?"
    )) return;


    const {
        error
    } =
    await supabaseClient
    .from("files")
    .update({
        deleted_at:null
    })
    .eq("id",id);


    if(error){

        alert(error.message);

        return;
    }


    document.getElementById("status").textContent =
        "♻️ Fichier restauré.";

    await showTrash();

}


/* SUPPRESSION DEFINITIVE */

async function deleteForever(id,pathEncoded){

    if(!confirm(
        "⚠️ Supprimer définitivement ce fichier ?"
    )) return;


    const path =
        decodeURIComponent(pathEncoded);


    const {
        error:storageError
    } =
    await supabaseClient.storage
    .from("zoto-files")
    .remove([path]);


    if(storageError){

        alert(storageError.message);

        return;
    }


    const {
        error:dbError
    } =
    await supabaseClient
    .from("files")
    .delete()
    .eq("id",id);


    if(dbError){

        alert(dbError.message);

        return;
    }


    document.getElementById("status").textContent =
        "❌ Fichier supprimé définitivement.";

    await showTrash();

}


/* VOIR */

async function viewFile(pathEncoded,typeEncoded,nameEncoded){

    const path =
        decodeURIComponent(pathEncoded);

    const type =
        decodeURIComponent(typeEncoded);

    const name =
        decodeURIComponent(nameEncoded);


    const {
        data,
        error
    } =
    await supabaseClient.storage
    .from("zoto-files")
    .createSignedUrl(path,3600);


    if(error){

        alert(error.message);

        return;
    }


    const url =
        data.signedUrl;


    const content =
        document.getElementById("previewContent");


    content.innerHTML="";


    if(type.startsWith("image/")){

        content.innerHTML=`
            <h2>${escapeHtml(name)}</h2>
            <br>
            <img src="${url}">
        `;

    }

    else if(type.startsWith("video/")){

        content.innerHTML=`
            <h2>${escapeHtml(name)}</h2>
            <br>
            <video src="${url}" controls autoplay></video>
        `;

    }

    else if(type.startsWith("audio/")){

        content.innerHTML=`
            <h2>${escapeHtml(name)}</h2>
            <br>
            <audio src="${url}" controls autoplay></audio>
        `;

    }

    else if(type==="application/pdf"){

        content.innerHTML=`
            <h2>${escapeHtml(name)}</h2>
            <br>
            <iframe src="${url}"></iframe>
        `;

    }

    else{

        content.innerHTML=`

            <h2>
                📦 ${escapeHtml(name)}
            </h2>

            <br>

            <p>
                Aperçu direct non disponible.
            </p>

        `;

    }


    document.getElementById("preview").style.display =
        "flex";

}


/* DOWNLOAD */

async function downloadFile(pathEncoded,nameEncoded){

    const path =
        decodeURIComponent(pathEncoded);

    const name =
        decodeURIComponent(nameEncoded);


    const {
        data,
        error
    } =
    await supabaseClient.storage
    .from("zoto-files")
    .download(path);


    if(error){

        alert(error.message);

        return;
    }


    const url =
        URL.createObjectURL(data);


    const a =
        document.createElement("a");

    a.href=url;

    a.download=name;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

}


/* RECHERCHE */

function searchFiles(){

    const value =
        document.getElementById("search")
        .value
        .toLowerCase();


    if(!value){

        if(currentCategory){

            openCategory(currentCategory);

        }else{

            showHome();

        }

        return;
    }


    const results =
        allFiles.filter(
            file =>
                file.file_name
                .toLowerCase()
                .includes(value)
        );


    document.getElementById("pageTitle").textContent =
        "🔍 Résultats de recherche";


    renderFiles(
        results,
        "🔍 Résultats"
    );

}


/* FERMER PREVIEW */

function closePreview(){

    document.getElementById("preview").style.display =
        "none";

    document.getElementById("previewContent").innerHTML =
        "";

}


/* TAILLE */

function formatSize(bytes){

    if(!bytes) return "0 B";

    const units=[
        "B","KB","MB","GB"
    ];

    let size=bytes;

    let i=0;

    while(
        size>=1024 &&
        i<units.length-1
    ){

        size/=1024;

        i++;

    }

    return size.toFixed(2)+" "+units[i];

}


/* SECURITE */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent=text;

    return div.innerHTML;

}


/* LOGOUT */

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href="/auth.html";

}


/* START */

async function startApp(){

    const user=await getUser();

    if(user){

        await loadFiles();

    }

}

startApp();
