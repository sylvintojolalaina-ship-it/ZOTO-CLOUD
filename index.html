<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZOTO CLOUD</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logout {
            border: none;
            background: #dc2626;
            color: white;
            padding: 8px 13px;
            border-radius: 8px;
            cursor: pointer;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;

            box-shadow:
                0 4px 18px rgba(0,0,0,0.06);
        }

        .box h2 {
            margin-top: 0;
        }

        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 35px 20px;
            text-align: center;
        }

        .upload-area input {
            margin: 15px 0;
        }

        .upload-button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 9px;
            cursor: pointer;
        }

        .upload-button:hover {
            background: #1d4ed8;
        }

        #fileName {
            margin-top: 10px;
            color: #6b7280;
        }

        #fileList {
            margin-top: 20px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        .delete-button {
            background: #dc2626;
            border: none;
            color: white;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
        }

        /* ==========================
           NOTIFICATION
        ========================== */

        .notification-popup {

            display: none;

            position: fixed;

            top: 20px;
            right: 20px;

            width: 350px;
            max-width: calc(100% - 40px);

            background: white;

            border-radius: 14px;

            padding: 17px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.20);

            z-index: 99999;

            border-left:
                5px solid #2563eb;

            animation:
                notificationIn
                0.3s ease;
        }

        .notification-header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom: 12px;
        }

        .notification-title {
            font-size: 17px;
            font-weight: bold;
        }

        .notification-close {

            border: none;

            background:
                transparent;

            font-size: 20px;

            cursor: pointer;

            color: #6b7280;
        }

        .notification-close:hover {
            color: #111827;
        }

        #notificationText {

            color: #374151;

            line-height: 1.5;

            word-break: break-word;
        }

        @keyframes notificationIn {

            from {
                opacity: 0;
                transform:
                    translateY(-20px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 10px;
            }

            .notification-popup {
                top: 10px;
                right: 10px;
                width: calc(100% - 20px);
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        ☁️ ZOTO CLOUD
    </div>

    <div class="user-info">

        <span id="userEmail">
            ...
        </span>

        <button
            class="logout"
            onclick="logout()"
        >
            🚪 Déconnexion
        </button>

    </div>

</header>


<!-- ==========================
     NOTIFICATION POPUP
=========================== -->

<div
    id="notificationPopup"
    class="notification-popup"
>

    <div class="notification-header">

        <div class="notification-title">
            📢 Notification ZOTO CLOUD
        </div>

        <button
            class="notification-close"
            onclick="closeNotification()"
        >
            ✕
        </button>

    </div>

    <div id="notificationText">
        Notification...
    </div>

</div>


<main id="mainContent">

    <div
        id="loading"
        class="loading"
    >
        🔄 Chargement...
    </div>


    <div
        id="cloudContent"
        style="display:none;"
    >


        <!-- ==========================
             UPLOAD
        =========================== -->

        <section class="box">

            <h2>
                📤 Envoyer un fichier
            </h2>

            <div class="upload-area">

                <input
                    type="file"
                    id="fileInput"
                    onchange="showSelectedFile()"
                >

                <br>

                <button
                    class="upload-button"
                    onclick="uploadFile()"
                >
                    📤 Télécharger dans le Cloud
                </button>

                <div id="fileName">
                    Aucun fichier sélectionné
                </div>

            </div>

        </section>


        <!-- ==========================
             MES FICHIERS
        =========================== -->

        <section class="box">

            <h2>
                📁 Mes fichiers
            </h2>

            <div id="fileList">
                Chargement...
            </div>

        </section>


    </div>

</main>


<script>


let supabaseClient = null;

let currentUser = null;


/* ==========================================
   INITIALISATION
========================================== */

async function init() {

    try {

        const response =
            await fetch("/api/config");


        if (!response.ok) {

            throw new Error(
                "Impossible de récupérer la configuration Supabase."
            );

        }


        const config =
            await response.json();


        if (!config.url || !config.key) {

            throw new Error(
                "Configuration Supabase manquante."
            );

        }


        /*
         * IMPORTANT :
         *
         * config.key doit être
         * SUPABASE_PUBLISHABLE_KEY.
         *
         * NE JAMAIS mettre sb_secret_...
         * dans ce fichier.
         */

        supabaseClient =
            window.supabase.createClient(
                config.url,
                config.key
            );


        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getUser();


        if (error || !data.user) {

            window.location.href =
                "auth.html";

            return;

        }


        currentUser =
            data.user;


        document.getElementById(
            "userEmail"
        ).textContent =
            currentUser.email || "";


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "cloudContent"
        ).style.display =
            "block";


        await loadFiles();


        /*
         * Charger notification
         */

        await loadNotifications();


        /*
         * Vérifier régulièrement
         * s'il y a une nouvelle notification.
         */

        setInterval(
            loadNotifications,
            10000
        );

    }


    catch (error) {

        console.error(
            "INIT ERROR:",
            error
        );


        document.getElementById(
            "loading"
        ).innerHTML =
            "❌ Erreur : " +
            escapeHtml(
                error.message
            );

    }

}


/* ==========================================
   NOTIFICATIONS
========================================== */

async function loadNotifications() {

    if (!supabaseClient) {
        return;
    }


    if (!currentUser) {

        const {
            data
        } =
            await supabaseClient
                .auth
                .getUser();


        currentUser =
            data?.user || null;

    }


    if (!currentUser) {
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("notifications")
            .select(
                "id,message,created_at"
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .eq(
                "is_read",
                false
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(1);


    if (error) {

        console.error(
            "NOTIFICATION ERROR:",
            error
        );

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        return;

    }


    const notification =
        data[0];


    /*
     * Afficher la notification
     */

    document.getElementById(
        "notificationText"
    ).textContent =
        notification.message;


    document.getElementById(
        "notificationPopup"
    ).style.display =
        "block";


    /*
     * Marquer comme lue
     */

    const {
        error:
            updateError
    } =
        await supabaseClient
            .from("notifications")
            .update({
                is_read: true
            })
            .eq(
                "id",
                notification.id
            );


    if (updateError) {

        console.error(
            "READ NOTIFICATION ERROR:",
            updateError
        );

    }

}


/* ==========================================
   FERMER NOTIFICATION
========================================== */

function closeNotification() {

    document.getElementById(
        "notificationPopup"
    ).style.display =
        "none";

}


/* ==========================================
   AFFICHER FICHIER
========================================== */

function showSelectedFile() {

    const input =
        document.getElementById(
            "fileInput"
        );


    const file =
        input.files[0];


    if (!file) {

        document.getElementById(
            "fileName"
        ).textContent =
            "Aucun fichier sélectionné";

        return;

    }


    const sizeMB =
        (
            file.size /
            (1024 * 1024)
        ).toFixed(2);


    document.getElementById(
        "fileName"
    ).textContent =
        file.name +
        " — " +
        sizeMB +
        " MB";

}


/* ==========================================
   UPLOAD
========================================== */

async function uploadFile() {

    const input =
        document.getElementById(
            "fileInput"
        );


    const file =
        input.files[0];


    if (!file) {

        alert(
            "⚠️ Misafidiana fichier aloha."
        );

        return;

    }


    if (!currentUser) {

        alert(
            "❌ Tsy misy session."
        );

        return;

    }


    try {

        /*
         * Mamorona chemin
         * manokana ho an'ny user.
         */

        const filePath =
            currentUser.id +
            "/" +
            Date.now() +
            "-" +
            file.name;


        const {
            error
        } =
            await supabaseClient
                .storage
                .from("zoto-files")
                .upload(
                    filePath,
                    file
                );


        if (error) {

            throw error;

        }


        alert(
            "✅ Fichier envoyé avec succès !"
        );


        input.value = "";


        document.getElementById(
            "fileName"
        ).textContent =
            "Aucun fichier sélectionné";


        await loadFiles();

    }


    catch (error) {

        console.error(
            "UPLOAD ERROR:",
            error
        );


        alert(
            "❌ Erreur upload : " +
            error.message
        );

    }

}


/* ==========================================
   CHARGER FICHIERS
========================================== */

async function loadFiles() {

    if (!currentUser) {
        return;
    }


    const container =
        document.getElementById(
            "fileList"
        );


    container.innerHTML =
        "🔄 Chargement...";


    const {
        data,
        error
    } =
        await supabaseClient
            .storage
            .from("zoto-files")
            .list(
                currentUser.id,
                {
                    limit: 100,
                    sortBy: {
                        column:
                            "created_at",
                        order:
                            "desc"
                    }
                }
            );


    if (error) {

        container.innerHTML =
            "❌ Erreur : " +
            escapeHtml(
                error.message
            );

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty">📁 Aucun fichier.</div>';

        return;

    }


    container.innerHTML = "";


    data.forEach(
        file => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "file-item";


            const left =
                document.createElement(
                    "span"
                );


            left.textContent =
                "📄 " +
                file.name;


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "delete-button";


            button.textContent =
                "🗑️ Supprimer";


            button.onclick =
                function () {

                    deleteFile(
                        file.name
                    );

                };


            div.appendChild(
                left
            );


            div.appendChild(
                button
            );


            container.appendChild(
                div
            );

        }
    );

}


/* ==========================================
   SUPPRIMER FICHIER
========================================== */

async function deleteFile(fileName) {

    const confirmation =
        confirm(
            "Tena hofafana ve ity fichier ity ?"
        );


    if (!confirmation) {
        return;
    }


    const path =
        currentUser.id +
        "/" +
        fileName;


    const {
        error
    } =
        await supabaseClient
            .storage
            .from("zoto-files")
            .remove([
                path
            ]);


    if (error) {

        alert(
            "❌ Erreur : " +
            error.message
        );

        return;

    }


    alert(
        "✅ Fichier supprimé."
    );


    await loadFiles();

}


/* ==========================================
   DECONNEXION
========================================== */

async function logout() {

    const confirmation =
        confirm(
            "Voulez-vous vraiment vous déconnecter ?"
        );


    if (!confirmation) {
        return;
    }


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "auth.html";

}


/* ==========================================
   SECURITE HTML
========================================== */

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==========================================
   START
========================================== */

init();

</script>


</body>

</html>
