<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZOTO CLOUD - Stockage Cloud Gratuit</title>

<meta name="description"
content="ZOTO CLOUD est une plateforme de stockage cloud simple, rapide et sécurisée pour sauvegarder et gérer vos fichiers en ligne.">

<meta name="robots" content="index, follow">

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#2563eb">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   GLOBAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

:root{
    --text-color:#222;
    --muted-color:#666;
    --card-bg:rgba(255,255,255,.94);
    --border-color:rgba(0,0,0,.12);
}

body{
    background:#f4f7fb;
    color:var(--text-color);
    min-height:100vh;
    transition:color .3s,background .3s;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.08);
    z-index:-1;
    pointer-events:none;
}

h1,h2,h3,p,strong,label{
    color:var(--text-color);
}


/* =========================
   AFFICHAGE FICHIERS
========================= */

.view-options{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.view-options .section-title{
    margin-bottom:0;
}

.view-select{
    padding:10px 14px;
    border:1px solid var(--border-color);
    border-radius:9px;
    background:var(--card-bg);
    color:var(--text-color);
    cursor:pointer;
    font-size:14px;
}


/* LISTE */

.file-list.list-view{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}


/* GRILLE */

.file-list.grid-view{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(240px,1fr)
        );
    gap:16px;
}

.file-list.grid-view .file{
    flex-direction:column;
    align-items:flex-start;
    min-height:180px;
}

.file-list.grid-view .file-info{
    width:100%;
    flex-direction:column;
    align-items:flex-start;
}

.file-list.grid-view .file-icon{
    font-size:45px;
}


/* =========================
   BOUTON ...
========================= */

.file-menu-button{
    border:none;

    background:rgba(100,116,139,.12);

    color:var(--text-color);

    width:42px;
    height:42px;

    border-radius:10px;

    cursor:pointer;

    font-size:24px;

    flex-shrink:0;

    transition:.2s;
}

.file-menu-button:hover{
    background:rgba(37,99,235,.15);
}

.file-menu-button:active{
    transform:scale(.95);
}


/* =========================
   MENU CONTEXTUEL
========================= */

.file-context-menu{

    display:none;

    position:fixed;

    z-index:100000;

    min-width:210px;

    max-width:calc(100vw - 20px);

    background:var(--card-bg);

    border:
        1px solid
        var(--border-color);

    border-radius:12px;

    padding:8px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.22);

    backdrop-filter:blur(12px);

}

.file-context-menu button{

    width:100%;

    border:none;

    background:transparent;

    color:var(--text-color);

    padding:12px;

    border-radius:8px;

    text-align:left;

    cursor:pointer;

    font-size:14px;

    transition:.2s;

}

.file-context-menu button:hover{

    background:
        rgba(37,99,235,.12);

}

.file-context-menu button:active{

    transform:scale(.98);

}

.file-context-menu .danger{

    color:#dc2626;

}


/* =========================
   HEADER
========================= */

header{
    height:70px;

    background:var(--card-bg);

    color:var(--text-color);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    border-bottom:
        1px solid
        var(--border-color);

    gap:15px;

    position:sticky;

    top:0;

    z-index:100;

    backdrop-filter:blur(10px);
}

.logo{
    font-size:23px;

    font-weight:bold;

    white-space:nowrap;
}

.search{
    width:350px;

    padding:12px 18px;

    border:
        1px solid
        var(--border-color);

    border-radius:25px;

    outline:none;

    background:
        rgba(255,255,255,.9);

    color:#222;
}

.user-area{
    display:flex;

    align-items:center;

    gap:8px;
}

.user{
    font-weight:bold;

    max-width:200px;

    overflow:hidden;

    text-overflow:ellipsis;
}

.logout{
    border:none;

    background:#ef4444;

    color:white;

    padding:9px 14px;

    border-radius:8px;

    cursor:pointer;
}

.menu-button{
    display:none;

    border:none;

    background:#2563eb;

    color:white;

    padding:10px 13px;

    border-radius:8px;

    font-size:20px;

    cursor:pointer;
}


/* =========================
   NOTIFICATION
========================= */

.notification-popup{
    display:none;

    position:fixed;

    top:20px;

    right:20px;

    width:350px;

    max-width:
        calc(100% - 40px);

    background:white;

    color:#222;

    border-radius:14px;

    padding:17px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.20);

    z-index:99999;

    border-left:
        5px solid
        #2563eb;

    animation:
        notificationIn
        .3s ease;
}

.notification-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:12px;
}

.notification-title{
    font-size:17px;

    font-weight:bold;

    color:#222;
}

.notification-close{
    border:none;

    background:transparent;

    font-size:20px;

    cursor:pointer;

    color:#6b7280;
}

#notificationText{
    color:#374151;

    line-height:1.5;

    word-break:break-word;
}

@keyframes notificationIn{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================
   LAYOUT
========================= */

.container{
    display:flex;

    min-height:
        calc(100vh - 70px);
}

aside{
    width:230px;

    background:var(--card-bg);

    color:var(--text-color);

    padding:20px 15px;

    border-right:
        1px solid
        var(--border-color);

    flex-shrink:0;

    backdrop-filter:blur(10px);
}

aside button{
    width:100%;

    padding:13px;

    margin-bottom:8px;

    border:none;

    border-radius:10px;

    background:transparent;

    color:var(--text-color);

    text-align:left;

    cursor:pointer;

    font-size:15px;
}

aside button:hover{
    background:
        rgba(37,99,235,.12);
}

.upload{
    background:#2563eb !important;

    color:white !important;

    text-align:center !important;
}

.settings-btn{
    margin-top:15px;

    border-top:
        1px solid
        var(--border-color)
        !important;

    padding-top:18px !important;
}

main{
    flex:1;

    padding:30px;

    min-width:0;
}

.welcome{
    color:
        var(--muted-color)
        !important;

    margin:
        8px 0
        25px;
}

.status{
    background:var(--card-bg);

    color:var(--text-color);

    padding:15px;

    border-radius:10px;

    margin-bottom:20px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.08);
}


/* =========================
   STORAGE
========================= */

.storage-box{
    background:var(--card-bg);

    color:var(--text-color);

    padding:20px;

    border-radius:15px;

    margin-bottom:25px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.08);
}

.storage-header{
    display:flex;

    justify-content:space-between;

    gap:15px;

    margin-bottom:12px;
}

.storage-bar{
    width:100%;

    height:14px;

    background:#e5e7eb;

    border-radius:20px;

    overflow:hidden;
}

.storage-progress{
    height:100%;

    background:#2563eb;

    border-radius:20px;

    transition:
        width .4s ease;
}

.storage-details{
    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-top:10px;

    color:var(--muted-color);

    font-size:13px;
}

.settings-storage-title{
    margin-bottom:15px;
}


/* =========================
   CATEGORIES
========================= */

.categories{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

    margin-bottom:30px;
}

.category{
    background:var(--card-bg);

    color:var(--text-color);

    padding:25px;

    border-radius:15px;

    cursor:pointer;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.08);

    transition:.2s;
}

.category:hover{
    transform:
        translateY(-4px);
}

.category-icon{
    font-size:42px;

    margin-bottom:15px;
}

.category h3{
    margin-bottom:7px;
}

.category p{
    color:
        var(--muted-color)
        !important;
}


/* =========================
   FILES
========================= */

.file-list{
    display:grid;

    gap:12px;
}

.file{
    background:var(--card-bg);

    color:var(--text-color);

    padding:15px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.08);

    cursor:pointer;

    user-select:none;

    -webkit-user-select:none;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.file:hover{
    box-shadow:
        0 4px 14px
        rgba(0,0,0,.12);
}

.file:active{
    transform:scale(.995);
}

.file-info{
    display:flex;

    align-items:center;

    gap:15px;

    min-width:0;
}

.file-icon{
    font-size:35px;

    flex-shrink:0;
}

.file-name{
    font-weight:bold;

    color:var(--text-color);

    word-break:break-word;
}

.file-details{
    color:var(--muted-color);

    font-size:13px;

    margin-top:5px;
}


/* =========================
   ANCIENS ACTIONS
   CONSERVES POUR CORBEILLE
========================= */

.actions{
    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

.actions button{
    border:none;

    color:white;

    padding:9px 13px;

    border-radius:8px;

    cursor:pointer;
}

.view{
    background:#16a34a;
}

.download{
    background:#2563eb;
}

.trash{
    background:#f59e0b;
}

.restore{
    background:#16a34a;
}

.delete-permanent{
    background:#dc2626;
}


/* =========================
   BACK
========================= */

.back{
    border:none;

    background:#64748b;

    color:white;

    padding:10px 16px;

    border-radius:8px;

    cursor:pointer;

    margin-bottom:20px;
}

.empty{
    background:var(--card-bg);

    color:var(--muted-color);

    padding:30px;

    border-radius:12px;

    text-align:center;
}


/* =========================
   PREVIEW
========================= */

.preview{
    display:none;

    position:fixed;

    z-index:9999;

    inset:0;

    background:
        rgba(0,0,0,.75);

    align-items:center;

    justify-content:center;

    padding:20px;
}

.preview-box{
    background:white;

    color:#222;

    width:95%;

    max-width:1000px;

    max-height:90vh;

    border-radius:15px;

    padding:15px;

    position:relative;

    overflow:auto;
}

.close{
    position:absolute;

    right:15px;

    top:10px;

    border:none;

    background:#ef4444;

    color:white;

    font-size:18px;

    width:38px;

    height:38px;

    border-radius:50%;

    cursor:pointer;
}

#previewContent{
    margin-top:45px;

    text-align:center;
}

#previewContent img{
    max-width:100%;

    max-height:75vh;

    border-radius:10px;
}

#previewContent video{
    width:100%;

    max-height:75vh;
}

#previewContent audio{
    width:100%;
}

#previewContent iframe{
    width:100%;

    height:75vh;

    border:none;
}


/* =========================
   SETTINGS
========================= */

.settings-panel{
    background:var(--card-bg);

    color:var(--text-color);

    max-width:700px;

    padding:25px;

    border-radius:15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.08);
}

.setting-group{
    margin-bottom:25px;

    padding-bottom:20px;

    border-bottom:
        1px solid
        var(--border-color);
}

.setting-group:last-child{
    border-bottom:none;
}

.setting-group h3{
    margin-bottom:15px;
}

.setting-group label{
    display:block;

    margin-bottom:7px;

    font-weight:bold;
}

.setting-group p{
    color:
        var(--muted-color)
        !important;
}

.setting-input,
.setting-select{
    width:100%;

    padding:12px;

    border:
        1px solid
        var(--border-color);

    border-radius:8px;

    margin-bottom:10px;

    background:
        rgba(255,255,255,.9);

    color:#222;
}

.setting-button{
    border:none;

    background:#2563eb;

    color:white;

    padding:11px 18px;

    border-radius:8px;

    cursor:pointer;
}

.danger-button{
    background:#ef4444;
}

.wallpaper-preview{
    width:100%;

    height:150px;

    border-radius:12px;

    background-size:cover;

    background-position:center;

    margin:10px 0;

    border:
        1px solid
        var(--border-color);
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .categories{
        grid-template-columns:
            repeat(2,1fr);
    }

    .search{
        width:250px;
    }

}


@media(max-width:700px){

    header{
        height:auto;

        min-height:65px;

        padding:10px 15px;

        flex-wrap:wrap;
    }

    .menu-button{
        display:block;
    }

    .logo{
        font-size:19px;
    }

    .user{
        display:none;
    }

    .search{
        width:100%;

        order:4;
    }

    .container{
        flex-direction:column;
    }

    aside{
        display:none;

        width:100%;

        border-right:none;

        border-bottom:
            1px solid
            var(--border-color);

        padding:12px;
    }

    aside.mobile-open{
        display:block;
    }

    main{
        padding:15px;
    }

    .categories{
        grid-template-columns:
            1fr 1fr;

        gap:10px;
    }

    .category{
        padding:17px;
    }

    .category-icon{
        font-size:32px;
    }

    .file{
        flex-direction:row;

        align-items:center;
    }

    .file-info{
        flex:1;
    }

    .storage-details{
        flex-direction:column;
    }

    .settings-panel{
        padding:18px;
    }

    .notification-popup{
        top:10px;

        right:10px;

        width:
            calc(100% - 20px);
    }

    .file-context-menu{
        min-width:200px;
    }

    /* =========================
   MOBILE - SIDEBAR
========================= */

@media(max-width:700px){

    header{
        height:auto;
        min-height:65px;
        padding:10px 15px;
        flex-wrap:wrap;
    }

    .menu-button{
        display:block;
    }

    .logo{
        font-size:19px;
    }

    .user{
        display:none;
    }

    .search{
        width:100%;
        order:4;
    }

    .container{
        flex-direction:column;
    }

    /* SIDEBAR CACHÉ PAR DÉFAUT SUR TÉLÉPHONE */
    aside{
        display:none;
        width:100%;
        border-right:none;
        border-bottom:1px solid var(--border-color);
        padding:12px;
    }

    /* SIDEBAR OUVERT AVEC ☰ */
    aside.mobile-open{
        display:block;
    }

    /* Tous les boutons restent visibles */
    aside button{
        display:block;
        width:100%;
    }

    main{
        padding:15px;
    }

    .categories{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .category{
        padding:17px;
    }

    .category-icon{
        font-size:32px;
    }

    .file{
        flex-direction:row;
        align-items:center;
    }

    .file-info{
        flex:1;
    }

    .storage-details{
        flex-direction:column;
    }

    .settings-panel{
        padding:18px;
    }

    .notification-popup{
        top:10px;
        right:10px;
        width:calc(100% - 20px);
    }

    .file-context-menu{
        min-width:200px;
    }

    /* Téléphone : titre simplifié */
    #pageTitle,
    .welcome{
        display:none;
    }
}

}


@media(max-width:430px){

    .categories{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:17px;
    }

    .logout{
        padding:8px 10px;

        font-size:12px;
    }

}


/* =========================
   TOUCH
========================= */

@media(hover:none){

    .file:hover{
        box-shadow:
            0 2px 8px
            rgba(0,0,0,.08);
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <button
        class="menu-button"
        onclick="toggleMenu()">

        ☰

    </button>


    <div class="logo">
        ☁️ ZOTO CLOUD
    </div>


    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔍 Rechercher un fichier..."
        oninput="searchFiles()"
    >


    <div class="user-area">

        <span
            id="userEmail"
            class="user">

            👤 Chargement...

        </span>


        <button
            class="logout"
            onclick="logout()">

            Déconnexion

        </button>

    </div>

</header>


<!-- =========================
     MENU ACTION FICHIER
========================= -->

<div
    id="fileContextMenu"
    class="file-context-menu">

    <button id="fileMenuView">

        👁️ Voir

    </button>


    <button id="fileMenuDownload">

        📥 Télécharger

    </button>


    <button
        id="fileMenuDelete"
        class="danger">

        🗑️ Supprimer

    </button>

</div>


<!-- =========================
     NOTIFICATION
========================= -->

<div
    id="notificationPopup"
    class="notification-popup">

    <div class="notification-header">

        <div class="notification-title">
            📢 Notification ZOTO CLOUD
        </div>


        <button
            class="notification-close"
            onclick="closeNotification()">

            ✕

        </button>

    </div>


    <div id="notificationText">
        Notification...
    </div>

</div>


<!-- =========================
     LAYOUT
========================= -->

<div class="container">


<aside id="sidebar">


    <button
        class="upload"
        onclick="
            document
            .getElementById('fileInput')
            .click()
        ">

        📤 Téléverser fichiers

    </button>


    <input
        type="file"
        id="fileInput"
        multiple
        style="display:none"
        onchange="uploadFiles(this.files)"
    >


    <button class="folder-upload" onclick="document.getElementById('folderInput').click()">
    📁 Téléverser un dossier
</button>


    <input
        type="file"
        id="folderInput"
        webkitdirectory
        directory
        multiple
        style="display:none"
        onchange="uploadFiles(this.files,true)"
    >


    <button onclick="showHome()">

        📁 Mes fichiers

    </button>


    <button onclick="openCategory('image')">

        🖼️ Images

    </button>


    <button onclick="openCategory('video')">

        🎥 Vidéos

    </button>


    <button onclick="openCategory('document')">

        📄 Documents

    </button>


    <button onclick="openCategory('pdf')">

        📕 PDF

    </button>


    <button onclick="openCategory('audio')">

        🎵 Audio

    </button>


    <button onclick="openCategory('other')">

        📦 Autres fichiers

    </button>


    <button onclick="showTrash()">

        🗑️ Corbeille

    </button>


    <button
        class="settings-btn"
        onclick="showSettings()">

        ⚙️ Paramètres

    </button>

</aside>


<!-- =========================
     MAIN
========================= -->

<main>

    <h1 id="pageTitle">

        Bienvenue sur ZOTO CLOUD 👋

    </h1>


    <p class="welcome">

        Votre espace personnel de stockage en ligne.

    </p>


    <div
        id="status"
        class="status">

        ☁️ Chargement...

    </div>


    <div id="content"></div>

</main>

</div>


<!-- =========================
     PREVIEW
========================= -->

<div
    id="preview"
    class="preview">

    <div class="preview-box">

        <button
            class="close"
            onclick="closePreview()">

            ✕

        </button>


        <div id="previewContent"></div>

    </div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://sbsixeaxhbvxezoylong.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__ZUPst8S6Vnl0U6jFhuUCw_g8bvahh6";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   VARIABLES
========================= */

let allFiles = [];
let currentFiles = [];
let currentCategory = null;
let currentUser = null;

/* Dossier actuellement ouvert */
let currentFolder = null;


/*
    Quota personnelle :
    1 GB
*/

const TOTAL_STORAGE =
1024 * 1024 * 1024;


/* =========================
   USER
========================= */

async function getUser(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(error || !data.user){

/* =========================
   UPLOAD
========================= */

async function uploadFiles(
    files,
    isFolder=false
){

    if(
        !files ||
        !files.length
    ){

        return;

    }


    const user =
        await getUser();


    if(!user) return;


    const status =
        document.getElementById(
            "status"
        );


    const fileArray =
        Array.from(files);


    let success = 0;

    let failed = 0;


    for(
        let i=0;
        i<fileArray.length;
        i++
    ){

        const file =
            fileArray[i];


        status.textContent =
            `⏳ Téléversement ${i+1}/${fileArray.length} : ${file.name}`;


        let relativePath =
            file.webkitRelativePath ||
            file.name;


        relativePath =
            relativePath
            .replace(/\\/g,"/")
            .replace(/^\/+/,"");


        const safePath =
            relativePath
            .split("/")
            .map(part =>
                part.replace(
                    /[^\w.\- ]/g,
                    "_"
                )
            )
            .join("/");


        const filePath =
            user.id +
            "/" +
            Date.now() +
            "_" +
            safePath;


        const {
            data,
            error
        } =
        await supabaseClient
            .storage
            .from("zoto-files")
            .upload(
                filePath,
                file
            );


        if(error){

            console.error(
                "UPLOAD ERROR:",
                error
            );

            failed++;

            continue;

        }


        const {
            error:dbError
        } =
        await supabaseClient
            .from("files")
            .insert({

                user_id:
                    user.id,

                file_name:
                    relativePath,

                file_path:
                    data.path,

                file_type:
                    file.type ||
                    "application/octet-stream",

                file_size:
                    file.size

            });


        if(dbError){

            console.error(
                "DATABASE ERROR:",
                dbError
            );

            failed++;

            continue;

        }


        success++;

    }


    status.textContent =
        `✅ ${success} fichier(s) envoyé(s)` +
        (
            failed
                ? ` • ❌ ${failed} échec(s)`
                : ""
        );


    document.getElementById(
        "fileInput"
    ).value = "";


    document.getElementById(
        "folderInput"
    ).value = "";


    await loadFiles();

}

    );

}


function getFreeStorage(){

    return Math.max(

/* =========================
   CLASSIFICATION
========================= */

function belongsTo(
    file,
    category
){

    const type =
        file.file_type || "";


    const name =
        file.file_name || "";


    if(category === "image")

        return type.startsWith(
            "image/"
        );


    if(category === "video")

        return type.startsWith(
            "video/"
        );


    if(category === "audio")

        return type.startsWith(
            "audio/"
        );


    if(category === "pdf")

        return type ===
            "application/pdf";


    if(category === "document"){

        return (

            type.includes("word") ||

            type.includes("document") ||

            type.includes("excel") ||

            type.includes(
                "spreadsheet"
            ) ||

            type.includes(
                "powerpoint"
            ) ||

            type.includes(
                "presentation"
            ) ||

            /\.(doc|docx|xls|xlsx|ppt|pptx)$/i
                .test(name)

        );

    }


    if(category === "other"){

        return !(

            belongsTo(
                file,
                "image"
            ) ||

            belongsTo(
                file,
                "video"
            ) ||

            belongsTo(
                file,
                "audio"
            ) ||

            belongsTo(
                file,
                "pdf"
            ) ||

            belongsTo(
                file,
                "document"
            )

        );

    }


    return false;

}

    );

        parts.length - 1
    ];

/* =========================
   ICONE FICHIER
========================= */

function getFileIcon(
    fileName,
    fileType
){

    const type =
        fileType || "";


    const name =
        fileName || "";


    if(type.startsWith("image/"))
        return "🖼️";


    if(type.startsWith("video/"))
        return "🎥";


    if(type.startsWith("audio/"))
        return "🎵";


    if(
        type ===
        "application/pdf" ||
        /\.pdf$/i.test(name)
    )
        return "📕";


    if(
        /\.(doc|docx)$/i.test(name) ||
        type.includes("word") ||
        type.includes("document")
    )
        return "📄";


    if(
        /\.(xls|xlsx)$/i.test(name) ||
        type.includes("excel") ||
        type.includes("spreadsheet")
    )
        return "📊";


    if(
        /\.(ppt|pptx)$/i.test(name) ||
        type.includes("powerpoint") ||
        type.includes("presentation")
    )
        return "📙";


    if(
        /\.(zip|rar|7z)$/i.test(name)
    )
        return "🗜️";


    if(
        /\.(txt|csv)$/i.test(name)
    )
        return "📝";


    return "📦";

}

        "block";


    let x = 20;

    let y = 20;


    if(event){

        if(
            typeof event.clientX ===
            "number"
        ){

            x =
                event.clientX;

            y =
                event.clientY;

        }

    }


    /*
        Raha mihoatra ny écran
        dia amboarina.
    */

    const rect =
        menu.getBoundingClientRect();


    if(
        x + rect.width >
        window.innerWidth
    ){

        x =
            window.innerWidth -
            rect.width -
            10;

    }


    if(
        y + rect.height >
        window.innerHeight
    ){

        y =
            window.innerHeight -
            rect.height -
            10;

    }


    menu.style.left =
        Math.max(
            10,
            x
        ) + "px";


    menu.style.top =
        Math.max(
            10,
            y
        ) + "px";

}

/* =========================
   VIEW MODE
========================= */

function changeViewMode(
    mode
){

    const fileList =
        document.getElementById(
            "fileList"
        );


    if(!fileList)
        return;


    if(mode === "grid"){

        fileList.classList.remove(
            "list-view"
        );

        fileList.classList.add(
            "grid-view"
        );

    }else{

        fileList.classList.remove(
            "grid-view"
        );

        fileList.classList.add(
            "list-view"
        );

    }


    try{

        localStorage.setItem(
            "zotoViewMode",
            mode
        );

    }catch(error){

        console.log(error);

    }

}


/* =========================
   VIEW MODE PAR DEFAUT
========================= */

function applySavedViewMode(){

    const select =
        document.getElementById(
            "viewModeSelect"
        );


    if(!select)
        return;


    let mode =
        "list";


    try{

        mode =
            localStorage.getItem(
                "zotoViewMode"
            ) || "list";

    }catch(error){

        mode = "list";

    }


    select.value =
        mode;


    changeViewMode(
        mode
    );

}


/* =========================
   PREVIEW
========================= */

async function previewFileById(
    fileId
){

    const file =
        allFiles.find(
            item =>
                String(item.id) ===
                String(fileId)
        );


    if(!file)
        return;


    const preview =
        document.getElementById(
            "preview"
        );


    const content =
        document.getElementById(
            "previewContent"
        );


    if(!preview || !content)
        return;


    content.innerHTML =
        "<p>⏳ Chargement...</p>";


    preview.style.display =
        "flex";


    const {
        data,
        error
    } =
    await supabaseClient
        .storage
        .from("zoto-files")
        .createSignedUrl(
            file.file_path,
            3600
        );


    if(error){

        content.innerHTML = `

            <p style="color:#dc2626;">

                ❌ Impossible d'afficher
                ce fichier.

            </p>

        `;

        console.error(error);

        return;

    }


    const url =
        data.signedUrl;


    const type =
        file.file_type || "";


    const name =
        file.file_name || "";


    if(type.startsWith("image/")){

        content.innerHTML = `

            <img
                src="${url}"
                alt="${escapeHTML(name)}"
            >

        `;

    }else if(
        type.startsWith("video/")
    ){

        content.innerHTML = `

            <video
                src="${url}"
                controls
                autoplay
            ></video>

        `;

    }else if(
        type.startsWith("audio/")
    ){

        content.innerHTML = `

            <audio
                src="${url}"
                controls
                autoplay
            ></audio>

        `;

    }else if(
        type ===
        "application/pdf" ||
        /\.pdf$/i.test(name)
    ){

        content.innerHTML = `

            <iframe
                src="${url}">
            </iframe>

        `;

    }else{

        content.innerHTML = `

            <div class="empty">

                📄 Aperçu non disponible
                pour ce type de fichier.

                <br><br>

                <button
                    class="setting-button"
                    onclick="downloadFileById('${escapeJS(file.id)}')">

                    📥 Télécharger

                </button>

            </div>

        `;

    }

}

/* =========================
   TELECHARGER
========================= */

async function downloadFileById(
    fileId
){

    const file =
        allFiles.find(
            item =>
                String(item.id) ===
                String(fileId)
        );


    if(!file)
        return;


    const status =
        document.getElementById(
            "status"
        );


    if(status){

        status.textContent =
            "⏳ Préparation du téléchargement...";

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .storage
        .from("zoto-files")
        .createSignedUrl(
            file.file_path,
            3600,
            {
                download:
                    getDisplayName(
                        file.file_name
                    )
            }
        );


    if(error){

        console.error(error);


        if(status){

            status.textContent =
                "❌ Erreur de téléchargement.";

        }

        return;

    }


    const link =
        document.createElement(
            "a"
        );


    link.href =
        data.signedUrl;


    link.download =
        getDisplayName(
            file.file_name
        );


    link.target =
        "_blank";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    if(status){

        status.textContent =
            "✅ Téléchargement lancé.";

    }

}


/* =========================
   SUPPRIMER
========================= */

async function deleteFileById(
    fileId
){

    const file =
        allFiles.find(
            item =>
                String(item.id) ===
                String(fileId)
        );


    if(!file)
        return;


    const name =
        getDisplayName(
            file.file_name
        );


    const confirmed =
        confirm(
            `Voulez-vous supprimer "${name}" ?`
        );


    if(!confirmed)
        return;


    const {
        error
    } =
    await supabaseClient
        .from("files")
        .update({

            deleted_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            file.id
        );


    if(error){

        console.error(error);


        alert(
            "❌ Erreur : " +
            error.message
        );

        return;

    }


    alert(
        "✅ Fichier déplacé vers la corbeille."
    );


    await loadFiles();

}


/* =========================
   CORBEILLE
========================= */

async function showTrash(){

    closeMobileMenu();

    currentCategory =
        null;

    currentFolder =
        null;


    document.getElementById(
        "pageTitle"
    ).textContent =
        "🗑️ Corbeille";


    const user =
        await getUser();


    if(!user)
        return;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("files")
        .select("*")
        .eq(
            "user_id",
            user.id
        )
        .not(
            "deleted_at",
            "is",
            null
        )
        .order(
            "deleted_at",
            {
                ascending:false
            }
        );


    if(error){

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="empty">

                ❌ ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        return;

    }


    const files =
        data || [];


    let html = "";


    files.forEach(file => {

        html += `

            <div class="file">

                <div class="file-info">

                    <div class="file-icon">

                        ${getFileIcon(
                            file.file_name,
                            file.file_type
                        )}

                    </div>


                    <div>

                        <div class="file-name">

                            ${escapeHTML(
                                getDisplayName(
                                    file.file_name
                                )
                            )}

                        </div>


                        <div class="file-details">

                            ${formatSize(
                                Number(
                                    file.file_size ||
                                    0
                                )
                            )}

                        </div>

                    </div>

                </div>


                <div class="actions">

                    <button
                        class="restore"
                        onclick="
                            restoreFile(
                                '${escapeJS(file.id)}'
                            )
                        ">

                        ♻️ Restaurer

                    </button>


                    <button
                        class="delete-permanent"
                        onclick="
                            permanentlyDeleteFile(
                                '${escapeJS(file.id)}'
                            )
                        ">

                        🗑️ Supprimer

                    </button>

                </div>

            </div>

        `;

    });


    if(!html){

        html = `

            <div class="empty">

                🗑️ La corbeille est vide.

            </div>

        `;

    }


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="view-options">

            <h2 class="section-title">

                🗑️ Corbeille

            </h2>

        </div>


        <div class="file-list">

            ${html}

        </div>

    `;

}


/* =========================
   RESTAURER
========================= */

async function restoreFile(
    fileId
){

    const {
        error
    } =
    await supabaseClient
        .from("files")
        .update({

            deleted_at:
                null

        })
        .eq(
            "id",
            fileId
        );


    if(error){

        alert(
            "❌ " +
            error.message
        );

        return;

    }


    alert(
        "✅ Fichier restauré."
    );


    await loadFiles();

}


/* =========================
   SUPPRESSION DEFINITIVE
========================= */

async function permanentlyDeleteFile(
    fileId
){

    const file =
        await getFileFromDatabase(
            fileId
        );


    if(!file)
        return;


    const confirmed =
        confirm(
            "⚠️ Cette action est définitive. Continuer ?"
        );


    if(!confirmed)
        return;


    /*
        Suppression Storage
    */

    const {
        error:
        storageError
    } =
    await supabaseClient
        .storage
        .from("zoto-files")
        .remove([
            file.file_path
        ]);


    if(storageError){

        console.error(
            storageError
        );

    }


    /*
        Suppression Database
    */

    const {
        error:
        dbError
    } =
    await supabaseClient
        .from("files")
        .delete()
        .eq(
            "id",
            fileId
        );


    if(dbError){

        alert(
            "❌ " +
            dbError.message
        );

        return;

    }


    alert(
        "✅ Fichier supprimé définitivement."
    );


    showTrash();

}


/* =========================
   GET FILE DATABASE
========================= */

async function getFileFromDatabase(
    fileId
){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("files")
        .select("*")
        .eq(
            "id",
            fileId
        )
        .single();


    if(error){

        console.error(
            error
        );

        return null;

    }


    return data;

}

/* =========================
   FORMAT SIZE
========================= */

function formatSize(
    bytes
){

    bytes =
        Number(bytes) || 0;


    if(bytes === 0)
        return "0 B";


    const units = [
        "B",
        "KB",
        "MB",
        "GB",
        "TB"
    ];


    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        bytes /
        Math.pow(
            1024,
            index
        )
    ).toFixed(
        index === 0 ? 0 : 2
    )
    + " "
    + units[index];

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   ESCAPE JAVASCRIPT
========================= */

function escapeJS(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}
